<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#102a2c"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>My Diet Log</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--fg:#172334;--muted:#687586;--line:#dce2e8;--accent:#146c73;--soft:#e6f3f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}body.dark{--bg:#101820;--card:#1b2732;--fg:#ecf4f6;--muted:#aab7c2;--line:#354450;--accent:#71d3c6;--soft:#243f43;color-scheme:dark}header{position:sticky;top:0;background:var(--card);z-index:3;border-bottom:1px solid var(--line);padding:12px max(14px,calc((100vw - 1100px)/2))}header .head{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:20px;margin:0}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:12px 0 8px}small,.muted{color:var(--muted)}nav{display:flex;overflow:auto;gap:5px;margin-top:12px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card);color:var(--fg)}button.primary,.active{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}button.danger{color:#d35454}nav button{white-space:nowrap;padding:8px 12px}main{max-width:1100px;margin:auto;padding:16px 14px 90px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.stat{font-size:25px;font-weight:750;margin:8px 0}.tag{font-size:12px;color:var(--muted)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:10px}.field{display:grid;gap:5px;min-width:0}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;min-width:0;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:10px}input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent)}input[type=file]{padding:6px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.wide{grid-column:1/-1}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.check span{flex:1}.progress{height:10px;border-radius:10px;background:var(--line);overflow:hidden}.progress>div{height:100%;background:var(--accent)}.photo{max-width:110px;max-height:95px;border-radius:8px;object-fit:cover}.notice{border-left:4px solid var(--accent);padding:9px 12px;background:var(--soft);border-radius:6px}.chart{width:100%;height:220px;display:block}.hidden{display:none!important}.mini{font-size:12px;padding:6px 9px}.nowrap{white-space:nowrap}footer{text-align:center;padding:12px;color:var(--muted);font-size:12px}@media(min-width:760px){.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two>.card{align-self:start}}@media(max-width:420px){.stat{font-size:22px}.card{padding:13px}}
@media(max-width:759px){header{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}header nav{position:fixed;bottom:0;left:0;right:0;z-index:20;margin:0;padding:7px 4px calc(7px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -3px 15px #0001;overflow:visible}header nav button{font-size:11px;white-space:normal;border:0;border-radius:9px;padding:12px 0;min-height:44px}main{padding:14px 12px calc(112px + env(safe-area-inset-bottom,0px))}footer{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}.card{margin-bottom:10px}input,select,textarea{font-size:16px}button{min-height:42px}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid .card{padding:12px}.grid .stat{font-size:20px;overflow-wrap:anywhere}}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}.calday{min-width:0;min-height:69px;padding:5px 1px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px}.calday small{font-size:9px;line-height:1.1}.calday.recorded{background:var(--soft)}.calday.selected{outline:2px solid var(--accent)}.nutrient{margin:14px 0}.nutrient .row{font-size:13px;gap:10px;flex-wrap:wrap}header nav{scrollbar-width:none}@media(max-width:759px){header nav{grid-template-columns:repeat(7,minmax(0,1fr))}header nav button{font-size:10px;padding:9px 1px}} </style></head><body><header><div class="head"><div><h1>My Diet Log</h1><small>iPhone中心・端末内記録</small></div><button id="theme" aria-label="表示モード切替">◐ 表示</button></div><nav id="nav"></nav></header><main id="app"><p>データベースを準備しています…</p></main><footer>データはこのブラウザ内に保存されます。定期的にJSONバックアップを保存してください。</footer><script>
'use strict';
const START='2026-11-03',INITIAL=67,HEIGHT=1.63,MEALS=['朝食','昼食','夕食','間食'],DAYS=['日','月','火','水','木','金','土'];
const defaults={version:1,settings:{calMin:1750,calMax:1850,proteinMin:100,proteinMax:120,goal1:62,goal2:59,stepWeekday:7000,stepWeekend:10000,theme:'auto'},checkDefs:[{id:'weight',name:'体重測定',days:[0,1,2,3,4,5,6]},{id:'breakfast',name:'朝食記録',days:[0,1,2,3,4,5,6]},{id:'lunch',name:'昼食記録',days:[0,1,2,3,4,5,6]},{id:'dinner',name:'夕食記録',days:[0,1,2,3,4,5,6]},{id:'snack',name:'間食記録',days:[0,1,2,3,4,5,6]},{id:'cal',name:'摂取カロリー目標確認',days:[0,1,2,3,4,5,6]},{id:'protein',name:'タンパク質目標確認',days:[0,1,2,3,4,5,6]},{id:'steps',name:'歩数目標達成',days:[0,1,2,3,4,5,6]},{id:'gym',name:'ジム・運動実施（予定日のみ）',days:[0,1,2,3,4,5,6],scheduled:true},{id:'sleep',name:'睡眠記録',days:[0,1,2,3,4,5,6]}],foods:[{id:'f1',name:'枝豆とひじきのサラダ（まいばすけっと）',cal:130,p:7,f:6,c:12,estimated:true},{id:'f2',name:'トップバリュ ノンオイル青じそドレッシング（25ml仮定）',cal:16,p:0.5,f:0,c:3,estimated:true},{id:'f3',name:'トップバリュ サラダチキン プレーン（1包装仮定）',cal:110,p:23,f:1.5,c:1,estimated:true}],meals:[],weights:[],activities:[],days:{},plans:{},extraFields:[]};
let db,state,tab='home',date=today(),editMeal=null,editActivity=null,editFood=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),num=v=>Number(v)||0;
function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function dt(s){return new Date(s+'T12:00:00+09:00')}function day(s){return dt(s).getUTCDay()}function shift(s,n){let d=dt(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}function fmt(s){return s+'（'+DAYS[day(s)]+'）'}function daily(s){return state.days[s]||{}}function goalSteps(s){return [0,6].includes(day(s))?num(state.settings.stepWeekend):num(state.settings.stepWeekday)}function entries(s){return state.meals.filter(x=>x.date===s)}function totals(s){return entries(s).reduce((a,x)=>{for(const k of ['cal','p','f','c'])a[k]+=num(x[k]);return a},{cal:0,p:0,f:0,c:0})}function weightAt(s){return state.weights.filter(x=>x.date<=s).sort((a,b)=>b.date.localeCompare(a.date))[0]?.kg??INITIAL}function plan(s){return state.plans[s]??state.plans['weekday'+day(s)]??{gym:false,text:''}}function checks(s){let d=daily(s),pl=plan(s);return state.checkDefs.filter(x=>x.days.includes(day(s))&&(!x.scheduled||pl.gym)).map(x=>({...x,done:!!(d.checks||{})[x.id]}))}function rate(s){let c=checks(s);return c.length?100*c.filter(x=>x.done).length/c.length:null}function pct(v){return v==null?'—':Math.round(v)+'%'}function label(k){return ({cal:'kcal',p:'g',f:'g',c:'g'})[k]}function save(){return new Promise((resolve,reject)=>{let tx=db.transaction('state','readwrite');tx.objectStore('state').put(state,'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function persist(){try{await save()}catch(e){alert('保存に失敗しました。容量不足の可能性があります。JSONバックアップを確認してください。');console.error(e)}}
function exportBackup(){download('diet-backup-'+today()+'.json',JSON.stringify({format:'my-diet-log',schemaVersion:1,exportedAt:new Date().toISOString(),data:state},null,2),'application/json')}function initDB(){return new Promise((res,rej)=>{let r=indexedDB.open('my-diet-log',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function read(){return new Promise((res,rej)=>{let r=db.transaction('state').objectStore('state').get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function merge(x){return {...structuredClone(defaults),...x,settings:{...defaults.settings,...x.settings},checkDefs:x.checkDefs||structuredClone(defaults.checkDefs)}}
const tabs=[['home','ホーム'],['meals','食事'],['weight','体重'],['exercise','運動'],['analysis','分析'],['calendar','履歴'],['settings','設定']];function navigate(t){tab=t;if(t==='home')date=today();render()}function render(){document.body.classList.toggle('dark',state.settings.theme==='dark'||state.settings.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);$('nav').innerHTML=tabs.map(([k,v])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('');$('app').innerHTML=({home,mealsPage,weightPage,exercisePage,analysisPage,calendarPage,settingsPage})[({home:'home',meals:'mealsPage',weight:'weightPage',exercise:'exercisePage',analysis:'analysisPage',calendar:'calendarPage',settings:'settingsPage'})[tab]]();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));bind();}
function dateField(){return `<div class="row"><label for="date">表示日</label><input style="width:auto" id="date" type="date" value="${date}"><button class="mini" id="today">今日</button></div>`}function metrics(s){let t=totals(s),w=weightAt(s),a=state.settings;return `<div class="grid">${[['現在体重',w.toFixed(1)+' kg'],['開始から',((w-INITIAL)>0?'+':'')+(w-INITIAL).toFixed(1)+' kg'],['第1目標まで',Math.max(0,w-a.goal1).toFixed(1)+' kg'],['摂取カロリー',Math.round(t.cal)+' / '+a.calMax+' kcal'],['残りカロリー',Math.round(a.calMax-t.cal)+' kcal'],['タンパク質',t.p.toFixed(1)+' / '+a.proteinMin+' g'],['歩数',num(daily(s).steps).toLocaleString()+' / '+goalSteps(s).toLocaleString()],['チェック達成率',pct(rate(s))]].map(([k,v])=>`<div class="card"><div class="tag">${k}</div><div class="stat">${v}</div></div>`).join('')}</div>`}
function checkUI(s){let cs=checks(s);return `<div class="row between"><strong>チェックリスト</strong><span>${cs.filter(x=>x.done).length}/${cs.length}（${pct(rate(s))}）</span></div><div class="progress"><div style="width:${rate(s)||0}%"></div></div>${cs.map(x=>`<label class="check"><input type="checkbox" data-check="${esc(x.id)}" ${x.done?'checked':''}><span>${esc(x.name)}</span></label>`).join('')}`}
function home(){let s=today(),t=totals(s),w=weightAt(s),p=plan(s),tom=shift(s,1),next=plan(tom),r=rate(s);let count=entries(s).length;return `<div class="row between"><h2>${fmt(s)}</h2><span class="muted">今日のまとめ</span></div><div class="grid"><section class="card"><div class="tag">体重</div><div class="stat">${w.toFixed(1)} kg</div><div class="muted">開始から ${(w-INITIAL)>0?'+':''}${(w-INITIAL).toFixed(1)} kg</div></section><section class="card"><div class="tag">摂取カロリー</div><div class="stat">${Math.round(t.cal)} kcal</div><div class="muted">残り ${Math.round(state.settings.calMax-t.cal)} kcal</div></section><section class="card"><div class="tag">タンパク質</div><div class="stat">${t.p.toFixed(1)} g</div><div class="muted">目標 ${state.settings.proteinMin}〜${state.settings.proteinMax}g</div></section><section class="card"><div class="tag">チェック達成</div><div class="stat">${pct(r)}</div><div class="progress"><div style="width:${r||0}%"></div></div></section></div><section class="card"><div class="row between"><h3>今日の食事</h3><button class="mini" id="goMeal">食事タブへ</button></div><p>${count?`${count}品を記録済み · ${Math.round(t.cal)} kcal · P ${t.p.toFixed(1)}g`:'まだ食事の記録はありません'}</p></section><section class="card"><div class="row between"><h3>今日の運動</h3><button class="mini" id="goExercise">運動タブへ</button></div><p>${p.gym?'ジム予定':'ジム予定なし'}${p.text?' · '+esc(p.text):''} · ${state.activities.filter(x=>x.date===s).length}件実施</p></section><section class="card"><h3>明日やること · ${fmt(tom)}</h3><p>${next.gym?'ジム予定あり':'ジム予定なし'}${next.text?' · '+esc(next.text):''}</p><div class="muted">${checks(tom).map(x=>esc(x.name)).join(' · ')}</div><button class="mini" id="goTomorrow">明日の記録を見る</button></section><section class="card"><div class="row between"><h3>今日のチェックリスト</h3><button class="mini" id="goCalendar">カレンダー</button></div>${checkUI(s)}</section>`}
function mealItems(s){let a=entries(s);return a.length?a.map(x=>`<div class="item row between"><div><strong>${esc(x.type)}｜${esc(x.name)}</strong><div class="muted">${Math.round(num(x.cal))} kcal · P ${num(x.p)}g ${x.estimated?'（推定）':''}</div>${x.photo?`<img class="photo" src="${x.photo}" alt="食事写真">`:''}</div><div class="row"><button class="mini" data-copy="${x.id}">コピー</button><button class="mini" data-editmeal="${x.id}">編集</button><button class="mini danger" data-delmeal="${x.id}">削除</button></div></div>`).join(''):'まだ記録はありません。'}
function mealForm(){let x=state.meals.find(x=>x.id===editMeal)||{},t=totals(date);return `<section class="card"><h2>${editMeal?'食事を編集':'食事を追加'}</h2><form id="mealForm" class="stack"><div class="formgrid"><div class="field"><label>日付</label><input name="date" type="date" required value="${x.date||date}"></div><div class="field"><label>食事区分</label><select name="type">${MEALS.map(m=>`<option ${x.type===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field wide"><label>登録食品から入力</label><select id="foodSelect"><option value="">選択しない</option>${state.foods.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}${f.estimated?'（推定）':''}</option>`).join('')}</select></div><div class="field wide"><label>食品名</label><input name="name" required value="${esc(x.name)}"></div><div class="field wide"><label>食事内容</label><textarea name="content">${esc(x.content)}</textarea></div>${['cal','p','f','c'].map((k,i)=>`<div class="field"><label>${['カロリー kcal','タンパク質 g','脂質 g','炭水化物 g'][i]}</label><input name="${k}" type="number" step="0.1" min="0" value="${x[k]??0}" required></div>`).join('')}<div class="field wide"><label>メモ</label><textarea name="memo">${esc(x.memo)}</textarea></div><div class="field wide"><label>写真（圧縮して保存）</label><input id="mealPhoto" type="file" accept="image/*"></div></div><label class="row"><input name="estimated" type="checkbox" ${x.estimated?'checked':''}> 栄養値は推定</label>${x.photo?`<div><img class="photo" src="${x.photo}" alt="登録写真"><label class="row"><input type="checkbox" name="removePhoto"> 写真を削除</label></div>`:''}<div class="row"><button class="primary" type="submit">保存</button>${editMeal?'<button type="button" id="cancelMeal">キャンセル</button>':''}</div></form></section>`}

function chatImportUI(){return `<section class="card"><h2>ChatGPTで計算した食品を登録</h2><p class="muted">ChatGPTの回答にあるJSONをコピーして貼り付けてください。複数食品にも対応。登録後は上のチェックリストと下のプルダウンから選べます。外部通信はしません。</p><textarea id="chatFoodJson" rows="7" spellcheck="false" placeholder='例：\n[{"name":"サラダチキン プレーン","cal":110,"p":23,"f":1.5,"c":1,"estimated":true}]'></textarea><div class="row" style="margin-top:10px"><button type="button" class="primary" id="chatFoodImport">食品マスターに登録</button><button type="button" id="chatFoodExample">入力例を表示</button></div><p id="chatFoodStatus" class="muted" role="status"></p><p class="muted" style="font-size:12px">必要項目：name（食品名）、cal（kcal）、p（タンパク質g）、f（脂質g）、c（炭水化物g）。既存と同じ食品名の場合は上書き確認します。</p></section>`}
function parseChatFoods(raw){let src=raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();let parsed=JSON.parse(src);let list=Array.isArray(parsed)?parsed:(Array.isArray(parsed.foods)?parsed.foods:[parsed]);if(!list.length||list.length>100)throw Error('1〜100食品のJSONを入力してください');return list.map((v,i)=>{if(!v||typeof v!=='object')throw Error(`${i+1}件目の形式が不正です`);let name=String(v.name??v['食品名']??'').trim();if(!name||name.length>200)throw Error(`${i+1}件目の食品名が不正です`);let x={name,estimated:v.estimated===undefined?true:!!v.estimated};for(let [k,j] of Object.entries({cal:'カロリー',p:'タンパク質',f:'脂質',c:'炭水化物'})){let value=v[k]??v[j];if(value===undefined||value===null||value==='')throw Error(`${name}：${j}がありません`);let n=Number(value);if(!Number.isFinite(n)||n<0||n>100000)throw Error(`${name}：${j}は0以上の数値にしてください`);x[k]=n}return x})}

function mealsPage(){let t=totals(date);return `<div class="row between"><h2>食事管理</h2>${dateField()}</div><div class="card"><strong>合計 ${Math.round(t.cal)} kcal / P ${t.p.toFixed(1)}g / F ${t.f.toFixed(1)}g / C ${t.c.toFixed(1)}g</strong><p>残り ${Math.round(state.settings.calMax-t.cal)} kcal</p><input id="mealSearch" placeholder="過去の食事を検索（食品名・内容・メモ）"></div><div id="searchResults"></div><section class="card"><h2>登録食品をまとめて追加</h2><p class="muted">複数の食品にチェックを入れ、一度に登録できます。食品ごとに個別の記録として保存されます。</p><div class="formgrid"><div class="field"><label>登録日</label><input id="bulkDate" type="date" value="${date}"></div><div class="field"><label>食事区分</label><select id="bulkType">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select></div></div><div class="stack" style="margin:12px 0">${state.foods.map(f=>`<label class="row" style="padding:10px;border:1px solid var(--line);border-radius:10px"><input type="checkbox" class="bulkFood" value="${esc(f.id)}"><span style="flex:1">${esc(f.name)} <small class="muted">${num(f.cal)} kcal / P ${num(f.p)}g ${f.estimated?'（推定）':''}</small></span></label>`).join('')}</div><p id="bulkTotals" aria-live="polite">0品選択・0 kcal / P 0g</p><button class="primary" id="bulkSave" type="button">選択した食品をまとめて登録</button></section><div class="two"><div>${mealForm()}</div><div class="card"><h2>${fmt(date)} の食事</h2>${mealItems(date)}<h3>初期登録：昼食パターン①</h3><p class="muted">登録食品から3品をそれぞれ追加できます。初期栄養値は仮の推定値です。</p><button id="addPattern">昼食パターン①を3品追加</button></div></div>`}
function weightPage(){let w=state.weights.find(x=>x.date===date),all=state.weights.filter(x=>x.date<=date&&x.date>=shift(date,-6));let avg=all.length?(all.reduce((a,x)=>a+x.kg,0)/all.length).toFixed(2):'—';let now=weightAt(date),before7=state.weights.filter(x=>x.date<=shift(date,-7)).sort((a,b)=>b.date.localeCompare(a.date))[0],before30=state.weights.filter(x=>x.date<=shift(date,-30)).sort((a,b)=>b.date.localeCompare(a.date))[0];let sorted=[...state.weights].filter(x=>x.date<=date).sort((a,b)=>a.date.localeCompare(b.date));let prediction='算出不可';if(sorted.length>1){let first=sorted[0],last=sorted.at(-1),span=(dt(last.date)-dt(first.date))/864e5,rate=(first.kg-last.kg)/span;if(rate>0&&span>=7)prediction=shift(last.date,Math.ceil((last.kg-state.settings.goal1)/rate));}return `<div class="row between"><h2>体重管理</h2>${dateField()}</div><div class="grid">${[['体重',now.toFixed(1)+'kg'],['BMI',(now/(HEIGHT*HEIGHT)).toFixed(1)],['7日間平均',avg+' kg'],['前週比',before7?(now-before7.kg).toFixed(1)+' kg':'—'],['前月比',before30?(now-before30.kg).toFixed(1)+' kg':'—'],['目標62kg予測',prediction],['開始から',(now-INITIAL).toFixed(1)+' kg'],['最終目標まで',Math.max(0,now-state.settings.goal2).toFixed(1)+' kg']].map(([k,v])=>`<div class="card"><div class="tag">${k}</div><div class="stat">${v}</div></div>`).join('')}</div><section class="card"><h2>体重を入力</h2><form id="weightForm" class="row"><input name="kg" style="max-width:170px" type="number" min="20" max="400" step="0.1" required value="${w?.kg??''}" placeholder="体重 kg"><button class="primary">保存・更新</button>${w?'<button type="button" class="danger" id="deleteWeight">この日の体重を削除</button>':''}</form></section><section class="card"><h2>体重推移</h2><canvas class="chart" data-chart="weight"></canvas><p class="muted">予測は7日以上の実測期間と減少傾向がある場合のみ表示します。</p></section>`}

function exercisePage(){return `<div class="row between"><h2>運動管理</h2>${dateField()}</div><section class="card"><h3>歩数・睡眠</h3><div class="formgrid"><div class="field"><label>歩数（目標 ${goalSteps(date).toLocaleString()}歩）</label><input id="steps" type="number" min="0" value="${daily(date).steps??''}"></div><div class="field"><label>睡眠時間（時間）</label><input id="sleep" type="number" min="0" max="24" step="0.1" value="${daily(date).sleep??''}"></div></div><button class="primary" id="saveDay">歩数・睡眠を保存</button></section><div class="two"><div>${activityForm()}</div><div class="card"><h2>曜日別の予定</h2>${DAYS.map((n,i)=>{let p=state.plans['weekday'+i]||{};return `<div class="item"><label class="row"><input type="checkbox" data-plan-day="${i}" ${p.gym?'checked':''}> ${n}曜日：ジム予定</label><input placeholder="予定の内容（例：有酸素30分）" data-plan-text="${i}" value="${esc(p.text)}"></div>`}).join('')}<button class="primary" id="savePlans">曜日別予定を保存</button><h3>選択日の例外設定</h3><button id="override">この日の予定を変更</button></div></div><div class="card"><h2>${fmt(date)} の運動履歴</h2>${state.activities.filter(x=>x.date===date).map(x=>`<div class="item row between"><div><strong>${esc(x.kind)}</strong> ${esc(x.minutes||'')}分 <span class="muted">${esc(x.start||'')}〜${esc(x.end||'')}</span><div class="muted">${esc(x.memo||'')}</div></div><div class="row"><button class="mini" data-editactivity="${x.id}">編集</button><button class="mini danger" data-delactivity="${x.id}">削除</button></div></div>`).join('')||'記録なし'}</div>`}

function nutrientBars(s){let t=totals(s),settings=state.settings;return [['カロリー',t.cal,settings.calMin,'kcal'],['タンパク質',t.p,settings.proteinMin,'g']].map(([name,val,target,unit])=>`<div class="nutrient"><div class="row between"><strong>${name}</strong><span>${Math.round(val*10)/10} / ${target} ${unit} · ${val>=target?'達成':'不足 '+Math.round((target-val)*10)/10+unit}</span></div><div class="progress"><div style="width:${Math.min(100,100*val/target)}%"></div></div></div>`).join('')+`<p class="muted">脂質 ${t.f.toFixed(1)}g ／ 炭水化物 ${t.c.toFixed(1)}g</p>`}
let calendarMonth=today().slice(0,7);
function calendarPage(){let [y,m]=calendarMonth.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1)).getUTCDay(),last=new Date(Date.UTC(y,m,0)).getUTCDate(),cells=Array.from({length:first},()=>'<span></span>');for(let i=1;i<=last;i++){let s=calendarMonth+'-'+String(i).padStart(2,'0'),e=entries(s),w=state.weights.find(x=>x.date===s),r=rate(s),act=state.activities.filter(x=>x.date===s).length,has=e.length||w||daily(s).steps!=null||act;cells.push(`<button class="calday ${s===date?'selected':''} ${has?'recorded':''}" data-calday="${s}"><strong>${i}</strong><small>${w?w.kg+'kg':''}</small><small>${e.length?'🍽'+e.length:''}${act?' 🏃':''}</small></button>`)}return `<div class="row between"><h2>記録カレンダー</h2><div class="row"><button class="mini" id="calPrev">◀</button><strong>${y}年${m}月</strong><button class="mini" id="calNext">▶</button></div></div><section class="card"><div class="calendar">${DAYS.map(x=>`<span class="muted">${x}</span>`).join('')}${cells.join('')}</div><p class="muted">日付を選ぶと下に記録を表示します。</p></section><section class="card"><h3>${fmt(date)} の記録</h3><p>体重：${state.weights.find(x=>x.date===date)?.kg??'未記録'} kg ／ 歩数：${daily(date).steps??'未記録'}</p><p>食事：${entries(date).length}品 ／ ${Math.round(totals(date).cal)} kcal ／ P ${totals(date).p.toFixed(1)}g</p><p>運動：${state.activities.filter(x=>x.date===date).length}件 ／ チェック：${pct(rate(date))}</p><div class="row"><button class="mini" id="calendarMeal">食事を編集</button><button class="mini" id="calendarWeight">体重を編集</button><button class="mini" id="calendarExercise">運動を編集</button></div><h3>チェックリスト</h3>${checkUI(date)}</section>`}

function settingsPage(){let s=state.settings;return `<h2>設定・バックアップ</h2><div class="two"><section class="card"><h2>目標設定</h2><form id="settingsForm" class="stack"><div class="formgrid">${[['calMin','カロリー下限 kcal'],['calMax','カロリー上限 kcal'],['proteinMin','タンパク質下限 g'],['proteinMax','タンパク質上限 g'],['goal1','第1目標 kg'],['goal2','最終目標 kg'],['stepWeekday','平日歩数'],['stepWeekend','休日歩数']].map(([k,v])=>`<div class="field"><label>${v}</label><input type="number" step="0.1" name="${k}" value="${s[k]}" required></div>`).join('')}</div><button class="primary">設定を保存</button></form></section><section class="card"><h2>バックアップ</h2><p>JSONには食事写真も含まれます。復元は現在のデータを置き換えます。</p><div class="stack"><button id="exportJson">全データをJSON出力</button><button id="exportCsv">記録をCSV出力（ZIPではなく複数CSV）</button><label class="field">JSONファイルを復元<input id="importJson" type="file" accept=".json,application/json"></label><button id="wipe" class="danger">全記録を初期化</button></div></section></div><section class="card"><h2>チェックリストの編集</h2><p class="muted">曜日は日・月・火・水・木・金・土。▲▼で順番変更。削除済み項目の履歴は内部に残ります。</p><div id="checkEditor">${state.checkDefs.map((x,i)=>`<div class="item"><div class="row"><input style="flex:1;min-width:150px" data-defname="${x.id}" value="${esc(x.name)}"><button class="mini" data-move="${x.id}" data-dir="-1">▲</button><button class="mini" data-move="${x.id}" data-dir="1">▼</button><button class="mini danger" data-deldef="${x.id}">削除</button></div><div class="row">${DAYS.map((n,j)=>`<label class="row"><input type="checkbox" data-defday="${x.id}" value="${j}" ${x.days.includes(j)?'checked':''}>${n}</label>`).join('')}</div><label class="row"><input type="checkbox" data-defscheduled="${x.id}" ${x.scheduled?'checked':''}>運動予定日のみ表示</label></div>`).join('')}</div><div class="row"><button id="addDef">項目を追加</button><button class="primary" id="saveDefs">チェック項目を保存</button></div></section>${chatImportUI()}<section class="card"><h2>よく食べる食品</h2><form id="foodForm" class="formgrid"><div class="field wide"><label>食品名</label><inp function bind(){if($('date')){$('date').onchange=e=>{date=e.target.value||today();render()};$('today').onclick=()=>{date=today();render()}}document.querySelectorAll('[data-check]').forEach(e=>e.onchange=async()=>{let d=state.days[date]||{};d.checks={...d.checks,[e.dataset.check]:e.checked};state.days[date]=d;await persist();render()});document.querySelectorAll('[data-editmeal]').forEach(e=>e.onclick=()=>{editMeal=e.dataset.editmeal;tab='meals';render()});document.querySelectorAll('[data-delmeal]').forEach(e=>e.onclick=async()=>{if(confirm('この食事記録を削除しますか？')){state.meals=state.meals.filter(x=>x.id!==e.dataset.delmeal);await persist();render()}});document.querySelectorAll('[data-copy]').forEach(e=>e.onclick=async()=>{let x=state.meals.find(x=>x.id===e.dataset.copy);let target=prompt('コピー先の日付（YYYY-MM-DD）',date);if(!target)return;if(!validDate(target))return alert('日付が不正です');state.meals.push({...x,id:uid(),date:target});await persist();render()});
