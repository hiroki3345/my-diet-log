const START='2026-11-03',INITIAL=67,HEIGHT=1.63,MEALS=['朝食','昼食','夕食','間食'],DAYS=['日','月','火','水','木','金','土'];

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),num=v=>Number(v)||0;
function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function dt(s){return new Date(s+'T12:00:00+09:00')}function day(s){return dt(s).getUTCDay()}function shift(s,n){let d=dt(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}function fmt(s){return s+'（'+DAYS[day(s)]+'）'}function daily(s){return state.days[s]||{}}function goalSteps(s){return [0,6].includes(day(s))?num(state.settings.stepWeekend):num(state.settings.stepWeekday)}function entries(s){return state.meals.filter(x=>x.date===s)}function totals(s){return entries(s).reduce((a,x)=>{for(const k of ['cal','p','f','c'])a[k]+=num(x[k]);if(x.sugar!==null&&x.sugar!==undefined&&x.sugar!==''){a.sugar+=num(x.sugar);a.sugarKnown++}return a},{cal:0,p:0,f:0,c:0,sugar:0,sugarKnown:0})}function weightAt(s){return state.weights.filter(x=>x.date<=s).sort((a,b)=>b.date.localeCompare(a.date))[0]?.kg??INITIAL}function plan(s){return effectivePlan(s)}function checks(s){let d=daily(s),pl=plan(s);return state.checkDefs.filter(x=>x.id!=='sleep'&&x.days.includes(day(s))&&(!x.scheduled||pl.gym)).map(x=>({...x,done:x.id==='gym'?exerciseDone(s):!!(d.checks||{})[x.id]}))}function rate(s){let c=checks(s);return c.length?100*c.filter(x=>x.done).length/c.length:null}function pct(v){return v==null?'—':Math.round(v)+'%'}function label(k){return ({cal:'kcal',p:'g',f:'g',c:'g'})[k]}function save(){return new Promise((resolve,reject)=>{let tx=db.transaction('state','readwrite');tx.objectStore('state').put(state,'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function persist(){try{await save();try{createAutoBackup(state)}catch(backupError){console.error("バックアップ失敗",backupError);alert("記録は保存されましたが、自動バックアップに失敗しました: "+backupError.message)}return true}catch(e){alert('保存に失敗しました。記録は保存されていません。容量とJSONバックアップを確認してください。');console.error(e);throw e}}
// Local three-generation snapshots, isolated from the primary IndexedDB record.
const AUTO_BACKUP_KEY='my-diet-log-auto-backups-v1';
function getAutoBackups(){
  const raw=localStorage.getItem(AUTO_BACKUP_KEY);
  if(raw===null)return [];
  const a=JSON.parse(raw);
  if(!Array.isArray(a)||!a.every(b=>b&&typeof b.createdAt==='string'&&validateState(b.data)))throw Error('自動バックアップの形式が不正です。既存のバックアップを保護するため操作を中止しました。');
  return a;
}
function hasUserRecords(d){return !!(d&&(Array.isArray(d.meals)&&d.meals.length||Array.isArray(d.weights)&&d.weights.length||Array.isArray(d.activities)&&d.activities.length||Array.isArray(d.foods)&&d.foods.some(f=>!['f1','f2','f3'].includes(f.id))||d.days&&Object.keys(d.days).length||d.extraFields?.length))}
function createAutoBackup(d){
  if(!validateState(d))throw Error('保存データが不正なため自動バックアップを作成しませんでした。');
  const previous=getAutoBackups();
  if(previous.some(b=>hasUserRecords(b.data))&&!hasUserRecords(d))return false;
  const snapshot={createdAt:new Date().toISOString(),data:structuredClone(d)};
  const next=[snapshot,...previous].slice(0,3);
  const serialized=JSON.stringify(next);
  localStorage.setItem(AUTO_BACKUP_KEY,serialized);
  if(localStorage.getItem(AUTO_BACKUP_KEY)!==serialized)throw Error('バックアップの書き込みを確認できませんでした。');
  return true;
}
async function restoreSnapshot(data){
  if(!validateState(data))throw Error('復元データが不正です。');
  if(!confirm('現在のデータを置き換えます。続行しますか？'))return;
  if(!validateState(state))throw Error('現在のデータを確認できません。復元を中止しました。');
  const previous=structuredClone(state);
  // Protect current data in a separately named emergency slot before replacement.
  const safetyKey='my-diet-log-before-restore';
  const serialized=JSON.stringify({createdAt:new Date().toISOString(),data:previous});
  localStorage.setItem(safetyKey,serialized);
  if(localStorage.getItem(safetyKey)!==serialized)throw Error('復元前の保護コピーを確認できません。');
  state=merge(structuredClone(data));
  try{await save()}catch(e){state=previous;throw e}
  location.reload();
}

function scheduleBlock(s){let p=effectivePlan(s),items=scheduleItems(s),d=daily(s),sleep=state.days[shift(s,-1)]?.sleep,warning=p.gym&&p.start&&p.start<'09:00'&&sleep!=null&&Number(sleep)<6;let w=weightAt(s);return `<section class="card"><h3>${fmt(s)} の運動予定</h3><p><strong>${p.gym?'ジム':'休養日'}</strong> ${esc(p.start||'')}${p.end?'〜'+esc(p.end):''}</p><p>${esc(p.text||'')}</p>${warning?'<p class="notice">前日の睡眠が6時間未満です。朝ジムは休養を推奨します。</p>':''}<p class="muted">${w<=59?'59kg以下：維持期への移行を検討。筋トレ週2回以上、有酸素週2〜3回を目安。予定は自動変更しません。':w<=62?'62〜59kg：週0.1〜0.3kgを目安に減量ペース・疲労・筋力を確認し、予定の見直しを検討（自動変更なし）。':'67〜62kg：週4回・週240分を目標にします。'} 疲労が強ければ日曜日は休養に変更できます。</p>${items.length?`<div class="stack">${items.map((x,i)=>`<div class="item"><strong>${esc(x.kind)}</strong> <span class="muted">${[x.minutes!=null?x.minutes+'分':'',x.reps!=null?x.reps+'回':'',x.seconds!=null?x.seconds+'秒':'',x.sets!=null?x.sets+'セット':'',x.speed!=null?x.speed+'km/h':'',x.incline!=null?'傾斜'+x.incline+'%':''].filter(Boolean).join(' · ')}</span></div>`).join('')}</div>`:''}<div class="row"><button class="primary" id="markWorkout" ${!p.gym?'disabled':''}>${exerciseDone(s)?'実施済み ✓（解除）':'運動を実施済みにする'}</button><button id="skipWorkout" ${!p.gym?'disabled':''}>${exerciseStatus(s)==='skipped'?'未実施を解除':'未実施にする'}</button></div><p class="muted">実施状況：${exerciseDone(s)?'実施済み':exerciseStatus(s)==='skipped'?'未実施':'未完了'}。時間経過では自動完了しません。消費カロリーは推定値です。</p><div class="row"><button class="mini" id="copyPlanItems" ${!items.length?'disabled':''}>予定種目を実績にコピー</button><button class="mini" id="override">この日の予定を変更</button></div></section>`}
function scheduleEditor(){return `<section class="card"><h2>毎週繰り返す運動予定</h2><p class="muted">祝日も曜日どおり。変更は今日以降に適用し、過去の予定・実績は保持します。</p>${DAYS.map((n,i)=>{let p=state.plans['weekday'+i]||{};return `<div class="item"><label class="row"><input type="checkbox" data-plan-day="${i}" ${p.gym?'checked':''}>${n}曜日：ジム</label><div class="formgrid"><label class="field">開始<input type="time" data-plan-start="${i}" value="${esc(p.start||'')}"></label><label class="field">終了<input type="time" data-plan-end="${i}" value="${esc(p.end||'')}"></label></div><label class="field">予定内容<input data-plan-text="${i}" value="${esc(p.text||'')}"></label><label class="field">種目詳細（JSON形式・任意）<textarea data-plan-items="${i}" rows="2">${esc(JSON.stringify(p.items||[]))}</textarea></label></div>`}).join('')}<button class="primary" id="savePlans">曜日別予定を保存</button></section>`}

let inputSection='meals';function inputPage(){const options=[['meals','食事'],['weight','体重'],['exercise','運動・歩数']];return `<h2>記録を入力</h2><div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:14px">${options.map(([k,v])=>`<button type="button" class="${inputSection===k?'primary':'mini'}" data-input-section="${k}">${v}</button>`).join('')}</div>${({meals:mealsPage,weight:weightPage,exercise:exercisePage})[inputSection]()}`}const tabs=[['home','ホーム'],['input','入力'],['workout','運動'],['analysis','分析'],['settings','設定']];function navigate(t){tab=t;if(t==='home')date=today();render()}function render(){document.body.classList.toggle('dark',state.settings.theme==='dark'||state.settings.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);$('nav').innerHTML=tabs.map(([k,v])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('');$('app').innerHTML=({home,input:inputPage,workout:workoutTab,analysis:analysisPage,settings:settingsPage})[tab]();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));document.querySelectorAll('[data-input-section]').forEach(b=>b.onclick=()=>{inputSection=b.dataset.inputSection;render()});bind();}
function dateField(){return `<div class="row"><label for="date">表示日</label><input style="width:auto" id="date" type="date" value="${date}"><button class="mini" id="today">今日</button></div>`}function metrics(s){let t=totals(s),w=weightAt(s),a=state.settings;return `<div class="grid">${[['現在体重',w.toFixed(1)+' kg'],['開始から',((w-INITIAL)>0?'+':'')+(w-INITIAL).toFixed(1)+' kg'],['第1目標まで',Math.max(0,w-a.goal1).toFixed(1)+' kg'],['摂取カロリー',Math.round(t.cal)+' / '+a.calMax+' kcal'],['残りカロリー',Math.round(a.calMax-t.cal)+' kcal'],['タンパク質',t.p.toFixed(1)+' / '+a.proteinMin+' g'],['歩数',num(daily(s).steps).toLocaleString()+' / '+goalSteps(s).toLocaleString()],['チェック達成率',pct(rate(s))]].map(([k,v])=>`<div class="card"><div class="tag">${k}</div><div class="stat">${v}</div></div>`).join('')}</div>`}
function checkUI(s){let cs=checks(s);return `<div class="row between"><strong>チェックリスト</strong><span>${cs.filter(x=>x.done).length}/${cs.length}（${pct(rate(s))}）</span></div><div class="progress"><div style="width:${rate(s)||0}%"></div></div>${cs.map(x=>`<label class="check"><input type="checkbox" data-check="${esc(x.id)}" ${x.done?'checked':''}><span>${esc(x.name)}</span></label>`).join('')}`}
function todayAgenda(s){
  const p=plan(s),earlyGym=p.gym&&p.start&&p.start<'09:00';
  const gymItem=p.gym?`<li>${p.start?esc(p.start)+'〜':''}${p.end?esc(p.end)+' ':''}ジム（${exerciseDone(s)?'実施済み':'未完了'}）${scheduleItems(s).length?`<ul>${scheduleItems(s).map(x=>`<li>${esc(x.kind)}${x.minutes!=null?' '+x.minutes+'分':''}${x.sets!=null?' '+x.sets+'セット':''}</li>`).join('')}</ul>`:''}</li>`:'';
  const checklist=checks(s),done=id=>checklist.find(x=>x.id===id)?.done?' ✓':'';
  const tasks=[`<li>起床・体重測定${done('weight')}</li>`,earlyGym?gymItem:'',`<li>朝食の記録${done('breakfast')}</li>`,!earlyGym?gymItem:'',`<li>昼食の記録${done('lunch')}</li>`,`<li>歩数目標 ${goalSteps(s).toLocaleString()}歩${done('steps')}</li>`,`<li>夕食の記録${done('dinner')}</li>`,`<li>間食があれば記録${done('snack')}</li>`,`<li>摂取カロリー・タンパク質の目標確認${done('cal')&&done('protein')?' ✓':''}</li>`].filter(Boolean);
  return `<ol style="padding-left:22px;line-height:1.8;margin:10px 0">${tasks.join('')}</ol>`;
}
function home(){let s=today(),t=totals(s),w=weightAt(s),p=plan(s),tom=shift(s,1),next=plan(tom),r=rate(s);let count=entries(s).length;return `<div class="row between"><h2>${fmt(s)}</h2><span class="muted">今日のまとめ</span></div><div class="grid"><section class="card"><div class="tag">体重</div><div class="stat">${w.toFixed(1)} kg</div><div class="muted">開始から ${(w-INITIAL)>0?'+':''}${(w-INITIAL).toFixed(1)} kg</div></section><section class="card"><div class="tag">摂取カロリー</div><div class="stat">${Math.round(t.cal)} kcal</div><div class="muted">残り ${Math.round(state.settings.calMax-t.cal)} kcal</div></section><section class="card"><div class="tag">タンパク質</div><div class="stat">${t.p.toFixed(1)} g</div><div class="muted">目標 ${state.settings.proteinMin}〜${state.settings.proteinMax}g</div></section><section class="card"><div class="tag">チェック達成</div><div class="stat">${pct(r)}</div><div class="progress"><div style="width:${r||0}%"></div></div></section></div><section class="card home-section home-nutrition"><h3>今日の栄養バランス</h3>${nutrientBars(s)}</section><section class="card home-section home-agenda"><div class="row between"><h3>今日の運動・朝からやること</h3><button class="mini" id="goExercise">運動タブへ</button></div>${todayAgenda(s)}</section><section class="card home-section home-tomorrow"><h3>明日やること · ${fmt(tom)}</h3><ul style="padding-left:22px;line-height:1.8;margin:10px 0"><li>${next.gym?'ジム予定あり':'ジム予定なし'}${next.text?'：'+esc(next.text):''}</li>${checks(tom).map(x=>`<li>${esc(x.name)}</li>`).join('')}</ul><button class="mini" id="goTomorrow">明日の記録を見る</button></section><section class="card home-section home-checks"><div class="row between"><h3>今日のチェックリスト</h3><button class="mini" id="goCalendar">カレンダーへ</button></div>${checkUI(s)}</section><section class="home-calendar" id="homeCalendar">${calendarPage()}</section>`}
function mealItems(s){let a=entries(s);return a.length?a.map(x=>`<div class="item row between"><div><strong>${esc(x.type)}｜${esc(x.name)}</strong><div class="muted">${Math.round(num(x.cal))} kcal · P ${num(x.p)}g · F ${num(x.f)}g · C ${num(x.c)}g · 糖質 ${x.sugar==null?'不明':num(x.sugar)+'g'} ${x.estimated?'（推定）':''}</div>${x.photo?`<img class="photo" src="${x.photo}" alt="食事写真">`:''}</div><div class="row"><button class="mini" data-copy="${x.id}">コピー</button><button class="mini" data-editmeal="${x.id}">編集</button><button class="mini danger" data-delmeal="${x.id}">削除</button></div></div>`).join(''):'まだ記録はありません。'}
function foodMatchesMeal(f,type){if(Array.isArray(f.mealTypes)&&f.mealTypes.length)return f.mealTypes.includes(type);const types=new Set(state.meals.filter(m=>m.name===f.name&&MEALS.includes(m.type)).map(m=>m.type));if(!types.size&&['f1','f2','f3'].includes(f.id))types.add('昼食');return !types.size||types.has(type)}
function foodOptions(type){return state.foods.filter(f=>foodMatchesMeal(f,type)).map(f=>`<option value="${esc(f.id)}">${esc(f.name)}${f.estimated?'（推定）':''}</option>`).join('')}
function updateFoodChoices(){const form=$('mealForm'),sel=$('foodSelect');if(!form||!sel)return;const type=form.elements.type.value,previous=sel.value;sel.innerHTML='<option value="">選択しない</option>'+foodOptions(type);if([...sel.options].some(o=>o.value===previous))sel.value=previous}
function updateBulkChoices(){const sel=$('bulkType'),items=document.querySelectorAll('.bulkFood');if(!sel||!items.length)return;const type=sel.value;items.forEach(el=>{const food=state.foods.find(f=>f.id===el.value);const show=!!food&&foodMatchesMeal(food,type);el.closest('label').style.display=show?'':'none';if(!show)el.checked=false});document.querySelectorAll('.bulkFood')[0]?.dispatchEvent(new Event('change'))}
function mealForm(){let x=state.meals.find(x=>x.id===editMeal)||{},t=totals(date);return `<section class="card"><h2>${editMeal?'食事を編集':'食事を追加'}</h2><form id="mealForm" class="stack"><div class="formgrid"><div class="field"><label>日付</label><input name="date" type="date" required value="${x.date||date}"></div><div class="field"><label>食事区分</label><select name="type">${MEALS.map(m=>`<option ${(x.type||lastMealType)===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field wide"><label>登録食品から入力</label><select id="foodSelect"><option value="">選択しない</option>${foodOptions(x.type||lastMealType)}</select></div><div class="field wide"><label>食品名</label><input name="name" required value="${esc(x.name)}"></div><div class="field wide"><label>食事内容</label><textarea name="content">${esc(x.content)}</textarea></div>${['cal','p','f','c'].map((k,i)=>`<div class="field"><label>${['カロリー kcal','タンパク質 g','脂質 g','炭水化物 g'][i]}</label><input name="${k}" type="number" step="0.1" min="0" value="${x[k]??0}" required></div>`).join('')}<div class="field"><label>糖質 g（不明なら空欄）</label><input name="sugar" type="number" step="0.1" min="0" value="${x.sugar??''}"></div><div class="field wide"><label>メモ</label><textarea name="memo">${esc(x.memo)}</textarea></div><div class="field wide"><label>写真（圧縮して保存）</label><input id="mealPhoto" type="file" accept="image/*"></div></div><label class="row"><input name="estimated" type="checkbox" ${x.estimated?'checked':''}> 栄養値は推定</label>${x.photo?`<div><img class="photo" src="${x.photo}" alt="登録写真"><label class="row"><input type="checkbox" name="removePhoto"> 写真を削除</label></div>`:''}<div class="row"><button class="primary" type="submit">保存</button>${editMeal?'<button type="button" id="cancelMeal">キャンセル</button>':''}</div></form></section>`}

function chatImportUI(){return `<section class="card"><h2>ChatGPTで計算した食品を登録</h2><p class="muted">ChatGPTの回答にあるJSONをコピーして貼り付けてください。複数食品にも対応。登録後は上のチェックリストと下のプルダウンから選べます。外部通信はしません。</p><textarea id="chatFoodJson" rows="7" spellcheck="false" placeholder='例：\n[{"name":"サラダチキン プレーン","cal":110,"p":23,"f":1.5,"c":1,"estimated":true}]'></textarea><div class="row" style="margin-top:10px"><button type="button" class="primary" id="chatFoodImport">食品マスターに登録</button><button type="button" id="chatFoodExample">入力例を表示</button></div><p id="chatFoodStatus" class="muted" role="status"></p><p class="muted" style="font-size:12px">必要項目：name（食品名）、cal（kcal）、p（タンパク質g）、f（脂質g）、c（炭水化物g）。既存と同じ食品名の場合は上書き確認します。</p></section>`}
function parseChatFoods(raw){let src=raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();let parsed=JSON.parse(src);let list=Array.isArray(parsed)?parsed:(Array.isArray(parsed.foods)?parsed.foods:[parsed]);if(!list.length||list.length>100)throw Error('1〜100食品のJSONを入力してください');return list.map((v,i)=>{if(!v||typeof v!=='object')throw Error(`${i+1}件目の形式が不正です`);let name=String(v.name??v['食品名']??'').trim();if(!name||name.length>200)throw Error(`${i+1}件目の食品名が不正です`);let x={name,estimated:v.estimated===undefined?true:!!v.estimated};for(let [k,j] of Object.entries({cal:'カロリー',p:'タンパク質',f:'脂質',c:'炭水化物'})){let value=v[k]??v[j];if(value===undefined||value===null||value==='')throw Error(`${name}：${j}がありません`);let n=Number(value);if(!Number.isFinite(n)||n<0||n>100000)throw Error(`${name}：${j}は0以上の数値にしてください`);x[k]=n}x.sugar=v.sugar===undefined||v.sugar===null||v.sugar===''?null:Number(v.sugar);if(x.sugar!==null&&(!Number.isFinite(x.sugar)||x.sugar<0))throw Error(`${name}：糖質が不正です`);return x})}

function mealsPage(){let t=totals(date);return `<div class="row between"><h2>食事管理</h2>${dateField()}</div><div class="card"><strong>合計 ${Math.round(t.cal)} kcal / P ${t.p.toFixed(1)}g / F ${t.f.toFixed(1)}g / C ${t.c.toFixed(1)}g</strong><p>糖質 ${t.sugarKnown?t.sugar.toFixed(1)+'g（判明分 '+t.sugarKnown+'/'+entries(date).length+'品）':'未記録'} ／ 残り ${Math.round(state.settings.calMax-t.cal)} kcal、P下限まで ${Math.max(0,state.settings.proteinMin-t.p).toFixed(1)}g</p>${nutrientBars(date)}<input id="mealSearch" placeholder="過去の食事を検索（食品名・内容・メモ）"></div><div id="searchResults"></div>${chatImportUI()}<section class="card"><h2>登録食品をまとめて追加</h2><p class="muted">複数の食品にチェックを入れ、一度に登録できます。食品ごとに個別の記録として保存されます。</p><div class="formgrid"><div class="field"><label>登録日</label><input id="bulkDate" type="date" value="${date}"></div><div class="field"><label>食事区分</label><select id="bulkType">${MEALS.map(m=>`<option ${lastMealType===m?'selected':''}>${m}</option>`).join('')}</select></div></div><div class="stack" style="margin:12px 0">${state.foods.map(f=>`<label class="row" style="padding:10px;border:1px solid var(--line);border-radius:10px"><input type="checkbox" class="bulkFood" value="${esc(f.id)}"><span style="flex:1">${esc(f.name)} <small class="muted">${num(f.cal)} kcal / P ${num(f.p)}g ${f.estimated?'（推定）':''}</small></span></label>`).join('')}</div><p id="bulkTotals" aria-live="polite">0品選択・0 kcal / P 0g</p><button class="primary" id="bulkSave" type="button">選択した食品をまとめて登録</button></section><div class="two"><div>${mealForm()}</div><div class="card"><h2>${fmt(date)} の食事</h2>${mealItems(date)}<h3>初期登録：昼食パターン①</h3><p class="muted">登録食品から3品をそれぞれ追加できます。初期栄養値は仮の推定値です。</p><button id="addPattern">昼食パターン①を3品追加</button></div></div>`}
function weeklyAverageDelta(s){let avg=(end)=>{let a=state.weights.filter(x=>x.date>=shift(end,-6)&&x.date<=end);return a.length?a.reduce((sum,x)=>sum+num(x.kg),0)/a.length:null};let a=avg(s),b=avg(shift(s,-7));return a===null||b===null?'—':(a-b).toFixed(2)+' kg'}
function weightPage(){let w=state.weights.find(x=>x.date===date),all=state.weights.filter(x=>x.date<=date&&x.date>=shift(date,-6));let avg=all.length?(all.reduce((a,x)=>a+x.kg,0)/all.length).toFixed(2):'—';let now=weightAt(date),before7=state.weights.filter(x=>x.date<=shift(date,-7)).sort((a,b)=>b.date.localeCompare(a.date))[0],before30=state.weights.filter(x=>x.date<=shift(date,-30)).sort((a,b)=>b.date.localeCompare(a.date))[0];let sorted=[...state.weights].filter(x=>x.date<=date).sort((a,b)=>a.date.localeCompare(b.date));let prediction='算出不可';if(sorted.length>1){let first=sorted[0],last=sorted.at(-1),span=(dt(last.date)-dt(first.date))/864e5,rate=(first.kg-last.kg)/span;if(rate>0&&span>=7)prediction=shift(last.date,Math.ceil((last.kg-state.settings.goal1)/rate));}return `<div class="row between"><h2>体重管理</h2>${dateField()}</div><div class="grid">${[['体重',now.toFixed(1)+'kg'],['BMI',(now/(HEIGHT*HEIGHT)).toFixed(1)],['7日間平均',avg+' kg'],['前週比',before7?(now-before7.kg).toFixed(1)+' kg':'—'],['前月比',before30?(now-before30.kg).toFixed(1)+' kg':'—'],['目標62kg予測',prediction],['開始から',(now-INITIAL).toFixed(1)+' kg'],['第1目標まで',Math.max(0,now-state.settings.goal1).toFixed(1)+' kg'],['7日平均の前週差',weeklyAverageDelta(date)],['最終目標まで',Math.max(0,now-state.settings.goal2).toFixed(1)+' kg']].map(([k,v])=>`<div class="card"><div class="tag">${k}</div><div class="stat">${v}</div></div>`).join('')}</div><section class="card"><p class="muted">減量の目安：週0.3〜0.6kg。起床後・トイレ後・飲食前に測定。2〜3週間平均体重が減らない場合は食事・歩数・運動量を確認。急激に減った場合は運動を増やさないでください。</p></section><section class="card"><h2>体重を入力</h2><form id="weightForm" class="row"><input name="kg" style="max-width:170px" type="number" min="20" max="400" step="0.1" required value="${w?.kg??''}" placeholder="体重 kg"><button class="primary">保存・更新</button>${w?'<button type="button" class="danger" id="deleteWeight">この日の体重を削除</button>':''}</form></section><section class="card"><h2>体重推移</h2><canvas class="chart" data-chart="weight"></canvas><p class="muted">予測は7日以上の実測期間と減少傾向がある場合のみ表示します。</p></section>`}
function activityForm(){let x=state.activities.find(x=>x.id===editActivity)||{};return `<div class="card"><h2>${editActivity?'運動を編集':'運動を記録'}</h2><form id="activityForm" class="stack"><div class="formgrid"><div class="field"><label>日付</label><input name="date" type="date" required value="${x.date||date}"></div><div class="field"><label>種目</label><input name="kind" required value="${esc(x.kind||'トレッドミル')}"></div><div class="field"><label>開始時刻</label><input name="start" type="time" value="${esc(x.start)}"></div><div class="field"><label>終了時刻</label><input name="end" type="time" value="${esc(x.end)}"></div><div class="field"><label>速度 km/h</label><input name="speed" type="number" min="0" step="0.1" value="${x.speed??''}"></div><div class="field"><label>傾斜 %</label><input name="incline" type="number" step="0.1" value="${x.incline??''}"></div><div class="field"><label>時間 分</label><input name="minutes" type="number" min="0" value="${x.minutes??''}"></div><div class="field"><label>重量 kg</label><input name="kg" type="number" min="0" step="0.5" value="${x.kg??''}"></div><div class="field"><label>回数</label><input name="reps" type="number" min="0" value="${x.reps??''}"></div><div class="field"><label>セット数</label><input name="sets" type="number" min="0" value="${x.sets??''}"></div><div class="field"><label>消費 kcal（任意）</label><input name="burn" type="number" min="0" value="${x.burn??''}"></div><div class="field wide"><label>メモ</label><textarea name="memo">${esc(x.memo)}</textarea></div></div><div class="row"><button class="primary">保存</button>${editActivity?'<button type="button" id="cancelActivity">キャンセル</button>':''}</div></form></div>`}
function progressReview(){let w=state.weights.filter(x=>x.date&&Number.isFinite(Number(x.kg))).sort((a,b)=>a.date.localeCompare(b.date));let recent=w.filter(x=>x.date>=shift(today(),-20));let first=recent.filter(x=>x.date<=shift(today(),-14));let last=recent.filter(x=>x.date>=shift(today(),-6));let avg=a=>a.reduce((t,x)=>t+Number(x.kg),0)/a.length;let plateau=first.length>=2&&last.length>=2&&Math.abs(avg(first)-avg(last))<0.2;let gym=state.activities.filter(x=>x.date>=shift(today(),-27));return `<section class="card"><h3>体重と運動実績の比較</h3><p>直近28日の運動記録：${gym.length}件 ／ 体重記録：${w.filter(x=>x.date>=shift(today(),-27)).length}件</p><p>体重の7日平均：${last.length?avg(last).toFixed(1)+'kg':'記録不足'}</p>${plateau?'<p class="notice">約2〜3週間、体重の平均値が横ばいです。食事・歩数・運動量を確認してください。予定は自動変更しません。</p>':''}<p class="muted">運動実績と体重の関連を確認するための参考値です。体重記録が少ない場合、停滞判定は行いません。</p></section>`}function exercisePage(){return `<div class="row between"><h2>運動管理</h2>${dateField()}</div><section class="card"><h3>歩数</h3><div class="formgrid"><div class="field"><label>歩数（目標 ${goalSteps(date).toLocaleString()}歩）</label><input id="steps" type="number" min="0" value="${daily(date).steps??''}"></div></div><button class="primary" id="saveDay">歩数を保存</button></section>${scheduleBlock(date)}<div class="two"><div>${activityForm()}</div><div>${scheduleEditor()}</div></div>${progressReview()}<section class="card"><h3>ジム実施率</h3><p>直近7日：${exerciseRate(7)} ／ 直近30日：${exerciseRate(30)}</p><p class="muted">週4回・240分目標。予定日を分母とし、手動で実施済みにした日だけ集計します。歩数未達は失敗扱いにしません。</p></section><div class="card"><h2>${fmt(date)} の運動履歴</h2>${state.activities.filter(x=>x.date===date).map(x=>`<div class="item row between"><div><strong>${esc(x.kind)}</strong> ${esc(x.minutes||'')}分 <span class="muted">${esc(x.start||'')}〜${esc(x.end||'')}</span><div class="muted">${esc(x.memo||'')}</div></div><div class="row"><button class="mini" data-editactivity="${x.id}">編集</button><button class="mini danger" data-delactivity="${x.id}">削除</button></div></div>`).join('')||'記録なし'}</div>`}

function nutrientBars(s){let t=totals(s),settings=state.settings;let rows=[['カロリー',t.cal,settings.calMin,'kcal'],['タンパク質',t.p,settings.proteinMin,'g']];let result=rows.map(([name,val,target,unit])=>`<div class="nutrient"><div class="row between"><strong>${name}</strong><span>${val.toFixed(1)} / ${target} ${unit} · ${val>=target?'下限達成':'下限まで '+(target-val).toFixed(1)+unit}</span></div><div class="progress"><div style="width:${Math.min(100,100*val/Math.max(1,target))}%"></div></div></div>`).join('');result+=`<p class="muted">脂質 ${t.f.toFixed(1)}g（総カロリーに合わせて調整）／炭水化物 ${t.c.toFixed(1)}g（糖質とは別）</p>`;let count=entries(s).length;if(t.sugarKnown){result+=`<div class="nutrient"><div class="row between"><strong>糖質（判明分）</strong><span>${t.sugar.toFixed(1)}g / 暫定目標 ${settings.carbMin}〜${settings.carbMax}g</span></div><div class="progress"><div style="width:${Math.min(100,100*t.sugar/Math.max(1,settings.carbMax))}%"></div></div></div>`;if(t.sugarKnown<count)result+='<p class="muted">糖質不明の食品があるため、糖質合計は一部のみです。炭水化物からの推定はしません。</p>'}else result+='<p class="muted">糖質：未記録（炭水化物からの自動換算なし）／暫定目標 '+settings.carbMin+'〜'+settings.carbMax+'g</p>';return result}

let calendarMonth=today().slice(0,7);
function calendarPage(){let [y,m]=calendarMonth.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1)).getUTCDay(),last=new Date(Date.UTC(y,m,0)).getUTCDate(),cells=Array.from({length:first},()=>'<span></span>');for(let i=1;i<=last;i++){let s=calendarMonth+'-'+String(i).padStart(2,'0'),e=entries(s),w=state.weights.find(x=>x.date===s),r=rate(s),act=state.activities.filter(x=>x.date===s).length,has=e.length||w||daily(s).steps!=null||act;cells.push(`<button class="calday ${s===date?'selected':''} ${has?'recorded':''}" data-calday="${s}"><strong>${i}</strong><small>${w?w.kg+'kg':''}</small><small>${e.length?'🍽'+e.length:''}${daily(s).steps!==undefined&&daily(s).steps!==null?' 👣':''}${act?' 🏃':''}</small></button>`)}return `<div class="row between"><h2>記録カレンダー</h2><div class="row"><button class="mini" id="calPrev">◀</button><strong>${y}年${m}月</strong><button class="mini" id="calNext">▶</button></div></div><section class="card"><div class="calendar">${DAYS.map(x=>`<span class="muted">${x}</span>`).join('')}${cells.join('')}</div><p class="muted">日付を選ぶと下に記録を表示します。</p></section><section class="card"><h3>${fmt(date)} の記録</h3><p>体重：${state.weights.find(x=>x.date===date)?.kg??'未記録'} kg ／ 歩数：${daily(date).steps??'未記録'}</p><p>食事：${entries(date).length}品 ／ ${Math.round(totals(date).cal)} kcal ／ P ${totals(date).p.toFixed(1)}g</p><p>運動：${state.activities.filter(x=>x.date===date).length}件 ／ チェック：${pct(rate(date))}</p><div class="row"><button class="mini" id="calendarMeal">食事を編集</button><button class="mini" id="calendarWeight">体重を編集</button><button class="mini" id="calendarExercise">運動を編集</button></div></section>`}

function pfcPanel(s){const t=totals(s),kcal=[t.p*4,t.f*9,t.c*4],sum=kcal.reduce((a,b)=>a+b,0),labels=['P タンパク質','F 脂質','C 炭水化物'],colors=['#219a92','#e6a146','#647ac9'];return `<section class="card"><h2>PFCバランス</h2><p class="muted">記録されたP・F・Cを熱量換算（P・C各4kcal/g、F9kcal/g）。食品の表示カロリー合計とは一致しない場合があります。</p><div class="pfc-bar">${kcal.map((v,i)=>`<div style="width:${sum?100*v/sum:0}%;background:${colors[i]}"></div>`).join('')}</div><div class="pfc-legend">${labels.map((v,i)=>`<div><span class="pfc-dot" style="background:${colors[i]}"></span><strong>${v}</strong><span>${sum?(100*kcal[i]/sum).toFixed(0):0}%</span><small>${[t.p,t.f,t.c][i].toFixed(1)}g</small></div>`).join('')}</div><p class="muted">糖質は炭水化物とは別管理。糖質が不明な食品は換算しません。</p></section>`}
function analysisOverview(s){const t=totals(s),a=state.settings,rows=[['摂取カロリー',t.cal.toFixed(0)+' kcal',a.calMin+'〜'+a.calMax+' kcal'],['タンパク質（P）',t.p.toFixed(1)+' g',a.proteinMin+'〜'+a.proteinMax+' g'],['脂質（F）',t.f.toFixed(1)+' g','総カロリーに応じて調整'],['炭水化物（C）',t.c.toFixed(1)+' g','糖質とは別'],['糖質',t.sugarKnown?t.sugar.toFixed(1)+' g（判明分）':'不明',a.carbMin+'〜'+a.carbMax+' g（暫定）'],['歩数',daily(s).steps==null?'未記録':Number(daily(s).steps).toLocaleString()+' 歩',goalSteps(s).toLocaleString()+' 歩']];return `<section class="card"><h2>今日の記録・目標一覧</h2><div class="analysis-table">${rows.map(([name,value,goal])=>`<div class="analysis-row"><strong>${name}</strong><div class="analysis-value">${value}</div><small>目標：${goal}</small></div>`).join('')}</div></section>`}
function workoutTab(){const s=today(),p=effectivePlan(s),items=scheduleItems(s),notes={

const pict={ 'ウォーミングアップ':'🚶','トレッドミル':'🏃','レッグプレス':'🦵','ラットプルダウン':'🏋️','チェストプレス':'💪','プランク':'🧘','エアロバイク':'🚴','クールダウン':'🚶'};
return `<div class="row between"><h2>今日の運動メニュー</h2><span class="muted">${fmt(s)}</span></div><section class="card"><div class="tag">本日の予定</div><div class="stat">${p.gym?'ジムの日':'休養日'}</div><p>${p.start?esc(p.start)+'〜'+esc(p.end||''):''} ${esc(p.text||'')}</p>${!p.gym?`<p>今日はジムの予定はありません。歩数目標 ${goalSteps(s).toLocaleString()}歩を目安に無理なく活動してください。</p>`:`<p class="muted">上から順番に実施。セット間は60〜90秒を目安に休憩し、時間内に終わらない場合は無理に詰め込まないでください。</p>`}</section>${p.gym?`<section class="card"><h3>ジムでやること（実施順）</h3><div class="workout-steps">${items.map((x,i)=>`<div class="workout-step"><div class="workout-illustration" aria-hidden="true">${pict[x.kind]||'🏃'}</div><div class="workout-detail"><div class="tag">STEP ${i+1}</div><strong>${esc(x.kind)}</strong><div class="workout-dose">${[x.minutes!=null?x.minutes+'分':'',x.reps!=null?x.reps+'回':'',x.seconds!=null?x.seconds+'秒':'',x.sets!=null?'× '+x.sets+'セット':'',x.speed!=null?x.speed+'km/h':'',x.incline!=null?'傾斜'+x.incline+'%':''].filter(Boolean).join(' ・ ')}</div><p>${esc(notes[x.kind]||'無理のないフォームで実施してください。')}</p></div></div>`).join('')}</div></section>`:''}<section class="card"><h3>運動の実施状況</h3><p>${exerciseDone(s)?'実施済み ✓':exerciseStatus(s)==='skipped'?'未実施':'未完了'}</p><button class="primary" id="workoutToggle" ${!p.gym?'disabled':''}>${exerciseDone(s)?'実施済みを解除':'今日のジムを実施済みにする'}</button><button class="mini" id="workoutInput">運動・歩数を入力</button></section>`}

function settingsPage(){let s=state.settings;return `<h2>設定・バックアップ</h2><section class="card"><div class="tag">アプリバージョン</div><div class="stat">Ver 1.9.0</div><p class="muted">2026年11月3日更新 · 強化版週間運動予定・黒色アイコン・既存記録維持</p></section><div class="two"><section class="card"><h2>目標設定</h2><form id="settingsForm" class="stack"><div class="formgrid">${[['calMin','カロリー下限 kcal'],['calMax','カロリー上限 kcal'],['proteinMin','タンパク質下限 g'],['proteinMax','タンパク質上限 g'],['carbMin','糖質下限 g（暫定）'],['carbMax','糖質上限 g（暫定）'],['goal1','第1目標 kg'],['goal2','最終目標 kg'],['stepWeekday','平日歩数'],['stepWeekend','休日歩数']].map(([k,v])=>`<div class="field"><label>${v}</label><input type="number" step="0.1" name="${k}" value="${s[k]}" required></div>`).join('')}</div><p class="muted">脂質は固定上限ではなく、摂取カロリー・タンパク質・糖質とのバランスで調整します。</p><button class="primary">設定を保存</button></form></section><section class="card"><h2>バックアップ</h2><p>JSONには食事写真も含まれます。復元は現在のデータを置き換えます。</p><div class="stack"><button id="exportJson">全データをJSON出力</button><button id="exportCsv">記録をCSV出力（ZIPではなく複数CSV）</button><label class="field">JSONファイルを復元<input id="importJson" type="file" accept=".json,application/json"></label><button id="wipe" class="danger">全記録を初期化</button></div></section></div>${backupManagementUI()}<section class="card"><h2>健康診断結果（参考情報）</h2><p class="muted">測定日：不明（登録しません）／診断・病名の自動判定は行いません。</p><div class="grid">${[['尿酸値',state.healthCheck.uricAcid,'mg/dL'],['クレアチニン',state.healthCheck.creatinine,'mg/dL'],['eGFR',state.healthCheck.egfr,'mL/min/1.73㎡'],['尿蛋白',state.healthCheck.urineProtein,''],['腹囲',state.healthCheck.waist,'cm'],['血糖値',state.healthCheck.glucose,'mg/dL'],['中性脂肪',state.healthCheck.triglycerides,'mg/dL']].map(([k,v,u])=>`<div class="item"><strong>${k}</strong><div>${esc(v)} ${esc(u)}</div></div>`).join('')}</div><p class="muted">尿酸値は正常上限付近です。今回の腎機能関連数値に明らかな異常を示す所見はありませんが、将来の健康状態を保証するものではありません。</p><h3>健康管理の注意事項</h3><ul><li>極端な糖質制限、断食、急激なカロリー制限を避ける</li><li>運動前後に水分を補給し、脱水を避ける</li><li>激しい運動を無理に続けない</li><li>アルコールや砂糖入り飲料の過剰摂取を避ける</li><li>尿酸値を数か月後に再確認する</li><li>睡眠6時間未満なら朝ジムの休養を推奨</li><li>関節の急な腫れや強い痛みがあれば運動を中止し、医療機関に相談</li></ul></section><section class="card"><h2>チェックリストの編集</h2><p class="muted">曜日は日・月・火・水・木・金・土。▲▼で順番変更。削除済み項目の履歴は内部に残ります。</p><div id="checkEditor">${state.checkDefs.filter(x=>x.id!=='sleep').map((x,i)=>`<div class="item"><div class="row"><input style="flex:1;min-width:150px" data-defname="${x.id}" value="${esc(x.name)}"><button class="mini" data-move="${x.id}" data-dir="-1">▲</button><button class="mini" data-move="${x.id}" data-dir="1">▼</button><button class="mini danger" data-deldef="${x.id}">削除</button></div><div class="row">${DAYS.map((n,j)=>`<label class="row"><input type="checkbox" data-defday="${x.id}" value="${j}" ${x.days.includes(j)?'checked':''}>${n}</label>`).join('')}</div><label class="row"><input type="checkbox" data-defscheduled="${x.id}" ${x.scheduled?'checked':''}>運動予定日のみ表示</label></div>`).join('')}</div><div class="row"><button id="addDef">項目を追加</button><button class="primary" id="saveDefs">チェック項目を保存</button></div></section><section class="card"><h2>よく食べる食品</h2><form id="foodForm" class="formgrid"><div class="field wide"><label>食品名</label><input name="name" required></div>${['cal','p','f','c'].map((k,i)=>`<div class="field"><label>${['kcal','P g','F g','C g'][i]}</label><input type="number" name="${k}" step="0.1" min="0" value="0" required></div>`).join('')}<div class="field"><label>糖質 g（不明なら空欄）</label><input type="number" name="sugar" step="0.1" min="0"></div><label class="row"><input type="checkbox" name="estimated">推定値</label><button class="primary">食品を登録</button></form>${state.foods.map(x=>`<div class="item row between"><span>${esc(x.name)}（${x.cal} kcal / P${x.p}g）${x.estimated?' 推定':''}</span><span class="row"><button class="mini" data-editfood="${x.id}">編集</button><button class="mini danger" data-delfood="${x.id}">削除</button></span></div>`).join('')}</section><section class="card notice"><h2>保存と利用上の注意</h2><p>IndexedDBに保存します。ブラウザのサイトデータ削除、プライベートブラウズ、端末変更などで消失する可能性があります。ファイルを別の場所で開くと別の保存領域になる場合があります。iPhoneとPCの自動同期はありません。iPhoneのファイルプレビューから直接開く場合、保存できないことがあります。端末内localhostサーバー経由でSafariから開く方法を推奨します。</p></section>`}

,text:note};await persist();render()};if($('markWorkout'))$('markWorkout').onclick=async()=>{let d=state.days[date]||{};d.workoutStatus=exerciseDone(date)?'pending':'done';state.days[date]=d;await persist();render()};if($('skipWorkout'))$('skipWorkout').onclick=async()=>{let d=state.days[date]||{};d.workoutStatus=d.workoutStatus==='skipped'?'pending':'skipped';state.days[date]=d;await persist();render()};if($('copyPlanItems'))$('copyPlanItems').onclick=async()=>{if(!confirm('この日の予定種目を実績として追加しますか？ 実施済みには自動変更しません。'))return;let p=effectivePlan(date);for(let item of scheduleItems(date))state.activities.push({id:uid(),date,kind:item.kind,start:p.start||'',end:p.end||'',minutes:item.minutes??null,speed:item.speed??null,incline:item.incline??null,kg:item.kg??null,reps:item.reps??null,sets:item.sets??null,burn:null,memo:'予定からコピー（実績を編集してください）'});await persist();render()};
