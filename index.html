// Local three-generation snapshots, isolated from the primary IndexedDB record.
const AUTO_BACKUP_KEY='my-diet-log-auto-backups-v1';
function getAutoBackups(){
  const raw=localStorage.getItem(AUTO_BACKUP_KEY);
  if(raw===null)return [];
  const a=JSON.parse(raw);
  if(!Array.isArray(a)||!a.every(b=>b&&typeof b.createdAt==='string'&&validateState(b.data)))throw Error('自動バックアップの形式が不正です。既存のバックアップを保護するため操作を中止しました。');
  return a;
}
function hasUserRecords(d){return !!(d&&(Array.isArray(d.meals)&&d.meals.length||Array.isArray(d.weights)&&d.weights.length||Array.isArray(d.activities)&&d.activities.length||Array.isArray(d.foods)&&d.foods.some(f=>!['f1','f2','f3'].includes(f.id))||d.days&&Object.keys(d.days).length||d.extraFields?.length))}
function createAutoBackup(d){
  if(!validateState(d))throw Error('保存データが不正なため自動バックアップを作成しませんでした。');
  const previous=getAutoBackups();
  if(previous.length&&JSON.stringify(previous[0].data)===JSON.stringify(d))return false;
  if(previous.some(b=>hasUserRecords(b.data))&&!hasUserRecords(d))return false;
  const snapshot={createdAt:new Date().toISOString(),data:structuredClone(d)};
  const next=[snapshot,...previous].slice(0,3);
  const serialized=JSON.stringify(next);
  localStorage.setItem(AUTO_BACKUP_KEY,serialized);
  if(localStorage.getItem(AUTO_BACKUP_KEY)!==serialized)throw Error('バックアップの書き込みを確認できませんでした。');
  return true;
}
async function restoreSnapshot(data){
  if(!validateState(data))throw Error('復元データが不正です。');

  if(!validateState(state))throw Error('現在のデータを確認できません。復元を中止しました。');
  const previous=structuredClone(state);
  // Protect current data in a separately named emergency slot before replacement.
  const safetyKey='my-diet-log-before-restore';
  const serialized=JSON.stringify({createdAt:new Date().toISOString(),data:previous});
  localStorage.setItem(safetyKey,serialized);
  if(localStorage.getItem(safetyKey)!==serialized)throw Error('復元前の保護コピーを確認できません。');

  try{await save()}catch(e){state=previous;throw e}

}

let inputSection='meals';function inputPage(){const options=[['meals','食事'],['weight','体重'],['exercise','運動・歩数']];return `<h2>記録を入力</h2><div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:14px">${options.map(([k,v])=>`<button type="button" class="${inputSection===k?'primary':'mini'}" data-input-section="${k}">${v}</button>`).join('')}</div>${({meals:mealsPage,weight:weightPage,exercise:exercisePage})[inputSection]()}`}const tabs=[['home','ホーム'],['input','入力'],['workout','運動'],['analysis','分析'],['settings','設定']];function navigate(t){tab=t;if(t==='home')date=today();render()}function applyAccentColor(){const color=/^#[0-9a-fA-F]{6}$/.test(state.settings.accentColor||'')?state.settings.accentColor:'#146c73';const r=parseInt(color.slice(1,3),16),g=parseInt(color.slice(3,5),16),b=parseInt(color.slice(5,7),16);const dark=document.body.classList.contains('dark');document.documentElement.style.setProperty('--accent',color);document.documentElement.style.setProperty('--soft',`rgba(${r},${g},${b},${dark?0.22:0.10})`);document.documentElement.style.setProperty('--accent-text',((r*299+g*587+b*114)/1000)>160?'#14202b':'#ffffff');}
function render(){document.body.classList.toggle('dark',state.settings.theme==='dark'||state.settings.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);applyAccentColor();$('nav').innerHTML=tabs.map(([k,v])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('');$('app').innerHTML=({home,input:inputPage,workout:workoutTab,analysis:analysisPage,settings:settingsPage})[tab]();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));document.querySelectorAll('[data-input-section]').forEach(b=>b.onclick=()=>{inputSection=b.dataset.inputSection;render()});bind();}
function dateField(){return `<div class="row"><label for="date">表示日</label><input style="width:auto" id="date" type="date" value="${date}"><button class="mini" id="today">今日</button></div>`}function metrics(s){let t=totals(s),w=weightAt(s),a=state.settings;return `<div class="grid">${[['現在体重',w.toFixed(1)+' kg'],['開始から',((w-INITIAL)>0?'+':'')+(w-INITIAL).toFixed(1)+' kg'],['第1目標まで',Math.max(0,w-a.goal1).toFixed(1)+' kg'],['摂取カロリー',Math.round(t.cal)+' / '+a.calMax+' kcal'],['残りカロリー',Math.round(a.calMax-t.cal)+' kcal'],['タンパク質',t.p.toFixed(1)+' / '+a.proteinMin+' g'],['歩数',num(daily(s).steps).toLocaleString()+' / '+goalSteps(s).toLocaleString()],['チェック達成率',pct(rate(s))]].map(([k,v])=>`<div class="card"><div class="tag">${k}</div><div class="stat">${v}</div></div>`).join('')}</div>`}
function checkUI(s){let cs=checks(s);return `<div class="row between"><strong>チェックリスト（ジムは対象外）</strong><span>${cs.filter(x=>x.done).length}/${cs.length}（${pct(rate(s))}）</span></div><div class="progress"><div style="width:${rate(s)||0}%"></div></div>${cs.map(x=>`<label class="check"><input type="checkbox" data-check="${esc(x.id)}" ${x.done?'checked':''}><span>${esc(x.name)}</span></label>`).join('')}`}
function todayAgenda(s){let e=entries(s),p=e.filter(x=>x.type==='昼食').reduce((v,x)=>v+num(x.p),0),sn=e.filter(x=>x.type==='間食');return `<ol style="padding-left:22px;line-height:1.8;margin:10px 0"><li><strong>食事を毎日記録</strong>（休日・概算も可）：本日${e.length}件</li><li><strong>昼食タンパク質30g以上を目安</strong>：現在${p.toFixed(1)}g（1日は下限80g・週平均90g目安。毎日100gのノルマなし）</li><li><strong>間食は「間食」に記録</strong>：現在${sn.length}件（小麦胚芽クラッカーは1日1個目安）</li><li>体重の7日平均を確認（毎日の増減では判定しない）</li><li>歩数は平日${num(state.settings.stepWeekday).toLocaleString()}歩・休日${num(state.settings.stepWeekend).toLocaleString()}歩を維持。追加不要</li><li>朝散歩は任意（15〜20分、起床時刻は変えない）。行かない日も失敗扱いしない</li></ol>`}
function home(){let s=today(),t=totals(s),w=weightAt(s),tom=shift(s,1),r=rate(s),a=weight7(s);return `<div class="row between"><h2>${fmt(s)}</h2><span class="muted">計測フェーズ：記録を優先</span></div><div class="grid"><section class="card"><div class="tag">体重の7日平均</div><div class="stat">${a?a.avg.toFixed(2)+' kg':'未記録'}</div><div class="muted">記録 ${a?a.count:0}/7日 ／ 最新測定 ${w.toFixed(1)}kg</div></section><section class="card"><div class="tag">摂取カロリー</div><div class="stat">${Math.round(t.cal)} kcal</div><div class="muted">設定目標 ${state.settings.calMin}〜${state.settings.calMax}kcal</div></section><section class="card"><div class="tag">タンパク質</div><div class="stat">${t.p.toFixed(1)}g</div><div class="muted">目標 ${state.settings.proteinMin}〜${state.settings.proteinMax}g</div></section><section class="card"><div class="tag">記録チェック</div><div class="stat">${pct(r)}</div><div class="muted">ジムは評価対象外</div><div class="progress"><div style="width:${r||0}%"></div></div></section></div><section class="card home-section home-nutrition"><h3>今日の栄養バランス</h3>${nutrientBars(s)}</section><section class="card home-section home-agenda"><div class="row between"><h3>今日の記録タスク</h3><button class="mini" id="goExercise">任意の運動記録</button></div>${todayAgenda(s)}</section><section class="card home-section home-tomorrow"><h3>明日やること · ${fmt(tom)}</h3><ul style="padding-left:22px;line-height:1.8;margin:10px 0"><li>休日も食事を記録（概算でも可）</li><li>昼食のタンパク質30g以上を目安にする（1日下限80g・週平均90g目安）</li><li>間食を区分して記録する</li><li>体重を記録し7日平均を見る</li><li>歩数は現在の目標を維持</li><li>朝散歩：任意（15〜20分、早起き不要）</li><li>ジム：任意（義務なし）</li></ul><button class="mini" id="goTomorrow">明日の記録を見る</button></section>${measurementPolicy()}<section class="card home-section home-checks"><div class="row between"><h3>今日のチェックリスト</h3><button class="mini" id="goCalendar">カレンダーへ</button></div>${checkUI(s)}</section><section class="home-calendar" id="homeCalendar">${calendarPage()}</section>`}
function mealItems(s){let a=entries(s);return a.length?a.map(x=>`<div class="item row between"><div><strong>${esc(x.type)}｜${esc(x.name)}</strong><div class="muted">${Math.round(num(x.cal))} kcal · P ${num(x.p)}g · F ${num(x.f)}g · C ${num(x.c)}g · 糖質 ${x.sugar==null?'不明':num(x.sugar)+'g'} ${x.estimated?'（推定）':''}</div>${x.photo?`<img class="photo" src="${x.photo}" alt="食事写真">`:''}</div><div class="row"><button class="mini" data-copy="${x.id}">コピー</button><button class="mini" data-editmeal="${x.id}">編集</button><button class="mini danger" data-delmeal="${x.id}">削除</button></div></div>`).join(''):'まだ記録はありません。'}
function foodMatchesMeal(f,type){if(Array.isArray(f.mealTypes)&&f.mealTypes.length)return f.mealTypes.includes(type);const types=new Set(state.meals.filter(m=>m.name===f.name&&MEALS.includes(m.type)).map(m=>m.type));if(!types.size&&['f1','f2','f3'].includes(f.id))types.add('昼食');return !types.size||types.has(type)}
function foodOptions(type){const matched=state.foods.filter(f=>foodMatchesMeal(f,type)),others=state.foods.filter(f=>!foodMatchesMeal(f,type)),opt=f=>`<option value="${esc(f.id)}">${esc(f.name)}${f.estimated?'（推定）':''}</option>`;return matched.map(opt).join('')+(others.length?`<optgroup label="その他の食品（すべて）">${others.map(opt).join('')}</optgroup>`:'')}
function updateFoodChoices(){const form=$('mealForm'),sel=$('foodSelect');if(!form||!sel)return;const type=form.elements.type.value,previous=sel.value;sel.innerHTML='<option value="">選択しない</option>'+foodOptions(type);if([...sel.options].some(o=>o.value===previous))sel.value=previous}
function updateBulkChoices(){const sel=$('bulkType');if(!sel)return;const type=sel.value,items=[...document.querySelectorAll('.bulkFood')];if(!items.length)return;const labels=items.map(el=>el.closest('label')),parent=labels[0]&&labels[0].parentElement;if(!parent)return;const matched=[],others=[];for(const l of labels){const f=state.foods.find(x=>x.id===l.querySelector('.bulkFood').value);(f&&foodMatchesMeal(f,type)?matched:others).push(l)}document.getElementById('bulkOthersHead')?.remove();for(const l of matched){l.style.display='';parent.appendChild(l)}if(matched.length&&others.length){const h=document.createElement('div');h.id='bulkOthersHead';h.className='muted';h.textContent='その他の食品（すべて）';parent.appendChild(h)}for(const l of others){l.style.display='';parent.appendChild(l)}}
function mealForm(){let x=state.meals.find(x=>x.id===editMeal)||{},t=totals(date);return `<section class="card"><h2>${editMeal?'食事を編集':'食事を追加'}</h2><form id="mealForm" class="stack"><div class="formgrid"><div class="field"><label>日付</label><input name="date" type="date" required value="${x.date||date}"></div><div class="field"><label>食事区分</label><select name="type">${MEALS.map(m=>`<option ${(x.type||lastMealType)===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field wide"><label>登録食品から入力</label><select id="foodSelect"><option value="">選択しない</option>${foodOptions(x.type||lastMealType)}</select></div><div class="field wide"><label>食品名</label><input name="name" required value="${esc(x.name)}"></div><div class="field wide"><label>食事内容</label><textarea name="content">${esc(x.content)}</textarea></div>${['cal','p','f','c'].map((k,i)=>`<div class="field"><label>${['カロリー kcal','タンパク質 g','脂質 g','炭水化物 g'][i]}</label><input name="${k}" type="number" step="0.1" min="0" value="${x[k]??0}" required></div>`).join('')}<div class="field"><label>糖質 g（不明なら空欄）</label><input name="sugar" type="number" step="0.1" min="0" value="${x.sugar??''}"></div><div class="field wide"><label>メモ</label><textarea name="memo">${esc(x.memo)}</textarea></div><div class="field wide"><label>写真（圧縮して保存）</label><input id="mealPhoto" type="file" accept="image/*"></div></div><label class="row"><input name="estimated" type="checkbox" ${x.estimated?'checked':''}> 栄養値は推定</label>${x.photo?`<div><img class="photo" src="${x.photo}" alt="登録写真"><label class="row"><input type="checkbox" name="removePhoto"> 写真を削除</label></div>`:''}<div class="row"><button class="primary" type="submit">保存</button>${editMeal?'<button type="button" id="cancelMeal">キャンセル</button>':''}</div></form></section>`}

function chatImportUI(place){return `<section class="card"><h2>ChatGPTで計算した食品を登録</h2><p class="muted">ChatGPTの回答にあるJSONをコピーして貼り付けてください。複数食品にも対応。登録後は${place==='settings'?'下の「よく食べる食品」に追加されます':'上のチェックリストと下のプルダウンから選べます'}。外部通信はしません。</p><textarea id="chatFoodJson" rows="7" spellcheck="false" placeholder='例：\n[{"name":"サラダチキン プレーン","cal":110,"p":23,"f":1.5,"c":1,"estimated":true}]'></textarea><div class="row" style="margin-top:10px"><button type="button" id="chatFoodPaste">クリップボードから貼り付け</button><button type="button" class="primary" id="chatFoodImport">食品マスターに登録</button><button type="button" id="chatFoodExample">入力例を表示</button></div><p id="chatFoodStatus" class="muted" role="status"></p><p class="muted" style="font-size:12px">必要項目：name（食品名）、cal（kcal）、p（タンパク質g）、f（脂質g）、c（炭水化物g）。既存と同じ食品名の場合は上書き確認します。</p></section>`}
function parseChatFoods(raw){let src=raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();let parsed=JSON.parse(src);let list=Array.isArray(parsed)?parsed:(Array.isArray(parsed.foods)?parsed.foods:[parsed]);if(!list.length||list.length>100)throw Error('1〜100食品のJSONを入力してください');return list.map((v,i)=>{if(!v||typeof v!=='object')throw Error(`${i+1}件目の形式が不正です`);let name=String(v.name??v['食品名']??'').trim();if(!name||name.length>200)throw Error(`${i+1}件目の食品名が不正です`);let x={name,estimated:v.estimated===undefined?true:!!v.estimated};for(let [k,j] of Object.entries({cal:'カロリー',p:'タンパク質',f:'脂質',c:'炭水化物'})){let value=v[k]??v[j];if(value===undefined||value===null||value==='')throw Error(`${name}：${j}がありません`);let n=Number(value);if(!Number.isFinite(n)||n<0||n>100000)throw Error(`${name}：${j}は0以上の数値にしてください`);x[k]=n}x.sugar=v.sugar===undefined||v.sugar===null||v.sugar===''?null:Number(v.sugar);if(x.sugar!==null&&(!Number.isFinite(x.sugar)||x.sugar<0))throw Error(`${name}：糖質が不正です`);return x})}

function mealsPage(){let t=totals(date);return `<div class="row between"><h2>食事管理</h2>${dateField()}</div><div class="card"><strong>合計 ${Math.round(t.cal)} kcal / P ${t.p.toFixed(1)}g / F ${t.f.toFixed(1)}g / C ${t.c.toFixed(1)}g</strong><p>糖質 ${t.sugarKnown?t.sugar.toFixed(1)+'g（判明分 '+t.sugarKnown+'/'+entries(date).length+'品）':'未記録'} ／ 残り ${Math.round(state.settings.calMax-t.cal)} kcal、P下限まで ${Math.max(0,state.settings.proteinMin-t.p).toFixed(1)}g</p>${nutrientBars(date)}<input id="mealSearch" placeholder="過去の食事を検索（食品名・内容・メモ）"></div><div id="searchResults"></div>${chatImportUI()}<section class="card"><h2>登録食品をまとめて追加</h2><p class="muted">複数の食品にチェックを入れ、一度に登録できます。食品ごとに個別の記録として保存されます。</p><div class="formgrid"><div class="field"><label>登録日</label><input id="bulkDate" type="date" value="${date}"></div><div class="field"><label>食事区分</label><select id="bulkType">${MEALS.map(m=>`<option ${lastMealType===m?'selected':''}>${m}</option>`).join('')}</select></div></div><div class="stack" style="margin:12px 0">${state.foods.map(f=>`<label class="row" style="padding:10px;border:1px solid var(--line);border-radius:10px"><input type="checkbox" class="bulkFood" value="${esc(f.id)}"><span style="flex:1">${esc(f.name)} <small class="muted">${num(f.cal)} kcal / P ${num(f.p)}g ${f.estimated?'（推定）':''}</small></span></label>`).join('')}</div><p id="bulkTotals" aria-live="polite">0品選択・0 kcal / P 0g</p><button class="primary" id="bulkSave" type="button">選択した食品をまとめて登録</button></section><div class="two"><div>${mealForm()}</div><div class="card"><h2>${fmt(date)} の食事</h2>${mealItems(date)}<h3>初期登録：昼食パターン①</h3><p class="muted">登録食品から3品をそれぞれ追加できます。初期栄養値は仮の推定値です。</p><button id="addPattern">昼食パターン①を3品追加</button></div></div>`}
function weeklyAverageDelta(s){let avg=(end)=>{let a=state.weights.filter(x=>x.date>=shift(end,-6)&&x.date<=end);return a.length?a.reduce((sum,x)=>sum+num(x.kg),0)/a.length:null};let a=avg(s),b=avg(shift(s,-7));return a===null||b===null?'—':(a-b).toFixed(2)+' kg'}
function weightPage(){let w=state.weights.find(x=>x.date===date),now=weightAt(date),cur=weight7(date),old=weight7(shift(date,-7));return `<div class="row between"><h2>体重管理</h2>${dateField()}</div><div class="grid">${[['7日平均',cur?cur.avg.toFixed(2)+'kg':'未記録'],['前の7日平均',old?old.avg.toFixed(2)+'kg':'未記録'],['7日平均の差',cur&&old?(cur.avg-old.avg).toFixed(2)+'kg':'比較不可'],['当日の体重',w?w.kg+'kg':'未記録'],['BMI',(now/(HEIGHT*HEIGHT)).toFixed(1)],['第1目標',state.settings.goal1+'kg'],['最終目標',state.settings.goal2+'kg']].map(([k,v])=>`<div class="card"><div class="tag">${k}</div><div class="stat">${v}</div></div>`).join('')}</div><section class="card"><p>進捗は7日平均で判定し、単日の上下では判断しません。</p></section>${progressReview()}<section class="card"><h2>体重を入力</h2><form id="weightForm" class="row"><input name="kg" style="max-width:170px" type="number" min="20" max="400" step="0.1" required value="${w?.kg??''}" placeholder="体重 kg"><button class="primary">保存・更新</button>${w?'<button type="button" class="danger" id="deleteWeight">この日の体重を削除</button>':''}</form></section><section class="card"><h2>体重推移</h2><canvas class="chart" data-chart="weight"></canvas></section>`}
function activityForm(){let x=state.activities.find(x=>x.id===editActivity)||{};return `<div class="card"><h2>${editActivity?'運動を編集':'運動を記録'}</h2><form id="activityForm" class="stack"><div class="formgrid"><div class="field"><label>日付</label><input name="date" type="date" required value="${x.date||date}"></div><div class="field"><label>種目</label><input name="kind" required value="${esc(x.kind||'トレッドミル')}"></div><div class="field"><label>開始時刻</label><input name="start" type="time" value="${esc(x.start)}"></div><div class="field"><label>終了時刻</label><input name="end" type="time" value="${esc(x.end)}"></div><div class="field"><label>速度 km/h</label><input name="speed" type="number" min="0" step="0.1" value="${x.speed??''}"></div><div class="field"><label>傾斜 %</label><input name="incline" type="number" step="0.1" value="${x.incline??''}"></div><div class="field"><label>時間 分</label><input name="minutes" type="number" min="0" value="${x.minutes??''}"></div><div class="field"><label>重量 kg</label><input name="kg" type="number" min="0" step="0.5" value="${x.kg??''}"></div><div class="field"><label>回数</label><input name="reps" type="number" min="0" value="${x.reps??''}"></div><div class="field"><label>セット数</label><input name="sets" type="number" min="0" value="${x.sets??''}"></div><div class="field"><label>消費 kcal（任意）</label><input name="burn" type="number" min="0" value="${x.burn??''}"></div><div class="field wide"><label>メモ</label><textarea name="memo">${esc(x.memo)}</textarea></div></div><div class="row"><button class="primary">保存</button>${editActivity?'<button type="button" id="cancelActivity">キャンセル</button>':''}</div></form></div>`}
function progressReview(){let end=today(),a=weight7(end),b=weight7(shift(end,-7)),dates=Array.from({length:14},(_,i)=>shift(end,-13+i)),full=dates.every(d=>d>=MEASURE_START&&entries(d).length>0&&state.weights.some(w=>w.date===d)),elapsed=end>=MEASURE_END,msg;if(!a||!b)msg='7日平均の比較に必要な体重記録が不足しています。';else if(!elapsed)msg='2週間の計測期間中です。日々の変動で判定しません。';else if(!full)msg='食事・体重の14日間の記録が揃っていません。停滞判定は保留します。';else if(Math.abs(a.avg-b.avg)<0.2)msg='2週間フル記録しても7日平均の差が0.2kg未満です。運動は増やさず、食事の記録漏れ・分量・調味料・間食を小さく見直します。これ以上摂取目標を下げません。';else msg='7日平均に変化が確認できました。引き続き同じ記録精度を維持します。';return `<section class="card"><h3>進捗判定：体重の7日平均</h3><p>直近7日：<strong>${a?a.avg.toFixed(2)+'kg（'+a.count+'/7日）':'記録不足'}</strong></p><p>前の7日：${b?b.avg.toFixed(2)+'kg（'+b.count+'/7日）':'記録不足'}</p><p>${esc(msg)}</p><p class="muted">判定には食事・体重の記録だけを使い、ジム実施率や歩数の増加は使いません。</p></section>`}
function exercisePage(){return `<div class="row between"><h2>運動・歩数の記録</h2>${dateField()}</div><section class="card"><h3>歩数（維持目標）</h3><p class="muted">平日${num(state.settings.stepWeekday).toLocaleString()}歩・休日${num(state.settings.stepWeekend).toLocaleString()}歩を維持。追加不要です。平日の活動量を不足と評価しません。</p><div class="formgrid"><div class="field"><label>歩数（目安 ${goalSteps(date).toLocaleString()}歩）</label><input id="steps" type="number" min="0" value="${daily(date).steps??''}"></div></div><button class="primary" id="saveDay">歩数を保存</button></section>${scheduleBlock(date)}<section class="card"><h3>ジム・運動（任意ログ）</h3><p>行った日だけ入力すれば十分です。行かなかった日の記録は不要です。</p>${activityForm()}</section>${progressReview()}<div class="card"><h2>${fmt(date)} の運動履歴</h2>${state.activities.filter(x=>x.date===date).map(x=>`<div class="item row between"><div><strong>${esc(x.kind)}</strong> ${esc(x.minutes||'')}分 <span class="muted">${esc(x.start||'')}〜${esc(x.end||'')}</span><div class="muted">${esc(x.memo||'')}</div></div><div class="row"><button class="mini" data-editactivity="${x.id}">編集</button><button class="mini danger" data-delactivity="${x.id}">削除</button></div></div>`).join('')||'記録なし（任意）'}</div>`}
function nutrientBars(s){
  const t=totals(s),settings=state.settings,count=entries(s).length;
  const bar=(name,val,target,unit,detail)=>`<div class="nutrient"><div class="row between"><strong>${name}</strong><span>${val.toFixed(1)} / ${target} ${unit} · ${detail}</span></div><div class="progress"><div style="width:${Math.min(100,100*val/Math.max(1,target))}%"></div></div></div>`;
  let result=bar('カロリー',t.cal,settings.calMin,'kcal',t.cal>=settings.calMin?'下限達成':'下限まで '+(settings.calMin-t.cal).toFixed(1)+'kcal');
  result+=bar('タンパク質',t.p,settings.proteinMin,'g',t.p>=settings.proteinMin?'下限達成':'下限まで '+(settings.proteinMin-t.p).toFixed(1)+'g');
  const fatLimit=Number(settings.fatMax)||60;
  result+=bar('脂質',t.f,fatLimit,'g',t.f>fatLimit?'目安を '+(t.f-fatLimit).toFixed(1)+'g 超過':'目安上限まで '+(fatLimit-t.f).toFixed(1)+'g');
  result+='<p class="muted">脂質の上限は目安です。総摂取カロリーに応じて調整してください。</p>';
  if(t.sugarKnown){
    const incomplete=t.sugarKnown<count;
    result+=bar(incomplete?'糖質（判明分）':'糖質',t.sugar,settings.carbMin,'g',incomplete?'一部未記録':t.sugar>=settings.carbMin?'暫定下限達成':'暫定下限まで '+(settings.carbMin-t.sugar).toFixed(1)+'g');
    result+=`<p class="muted">糖質の暫定目標 ${settings.carbMin}〜${settings.carbMax}g${incomplete?' ／ 糖質不明の食品があるため合計は判明分のみ':''}</p>`;
  }else{
    result+=`<div class="nutrient"><div class="row between"><strong>糖質</strong><span>0g / 暫定目標 ${settings.carbMin}〜${settings.carbMax}g</span></div><div class="progress"><div style="width:0%"></div></div></div>`;
  }
  result+=`<p class="muted">炭水化物 ${t.c.toFixed(1)}g（糖質とは別。自動換算なし）</p>`;
  return result;
}

let calendarMonth=today().slice(0,7);
function calendarPage(){let [y,m]=calendarMonth.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1)).getUTCDay(),last=new Date(Date.UTC(y,m,0)).getUTCDate(),cells=Array.from({length:first},()=>'<span></span>');for(let i=1;i<=last;i++){let s=calendarMonth+'-'+String(i).padStart(2,'0'),e=entries(s),w=state.weights.find(x=>x.date===s),r=rate(s),act=state.activities.filter(x=>x.date===s).length,has=e.length||w||daily(s).steps!=null||act;cells.push(`<button class="calday ${s===date?'selected':''} ${has?'recorded':''}" data-calday="${s}"><strong>${i}</strong><small>${w?w.kg+'kg':''}</small><small>${e.length?'🍽'+e.length:''}${daily(s).steps!==undefined&&daily(s).steps!==null?' 👣':''}${act?' 🏃':''}</small></button>`)}return `<div class="row between"><h2>記録カレンダー</h2><div class="row"><button class="mini" id="calPrev">◀</button><strong>${y}年${m}月</strong><button class="mini" id="calNext">▶</button></div></div><section class="card"><div class="calendar">${DAYS.map(x=>`<span class="muted">${x}</span>`).join('')}${cells.join('')}</div><p class="muted">日付を選ぶと下に記録を表示します。</p></section><section class="card"><h3>${fmt(date)} の記録</h3><p>体重：${state.weights.find(x=>x.date===date)?.kg??'未記録'} kg ／ 歩数：${daily(date).steps??'未記録'}</p><p>食事：${entries(date).length}品 ／ ${Math.round(totals(date).cal)} kcal ／ P ${totals(date).p.toFixed(1)}g</p><p>運動：${state.activities.filter(x=>x.date===date).length}件 ／ チェック：${pct(rate(date))}</p><div class="row"><button class="mini" id="calendarMeal">食事を編集</button><button class="mini" id="calendarWeight">体重を編集</button><button class="mini" id="calendarExercise">運動を編集</button></div></section>`}

function pfcPanel(s){const t=totals(s),kcal=[t.p*4,t.f*9,t.c*4],sum=kcal.reduce((a,b)=>a+b,0),labels=['P タンパク質','F 脂質','C 炭水化物'],colors=['#219a92','#e6a146','#647ac9'];return `<section class="card"><h2>PFCバランス</h2><p class="muted">記録されたP・F・Cを熱量換算（P・C各4kcal/g、F9kcal/g）。食品の表示カロリー合計とは一致しない場合があります。</p><div class="pfc-bar">${kcal.map((v,i)=>`<div style="width:${sum?100*v/sum:0}%;background:${colors[i]}"></div>`).join('')}</div><div class="pfc-legend">${labels.map((v,i)=>`<div><span class="pfc-dot" style="background:${colors[i]}"></span><strong>${v}</strong><span>${sum?(100*kcal[i]/sum).toFixed(0):0}%</span><small>${[t.p,t.f,t.c][i].toFixed(1)}g</small></div>`).join('')}</div><p class="muted">糖質は炭水化物とは別管理。糖質が不明な食品は換算しません。</p></section>`}
function analysisOverview(s){const t=totals(s),a=state.settings,rows=[['摂取カロリー',t.cal.toFixed(0)+' kcal',a.calMin+'〜'+a.calMax+' kcal'],['タンパク質（P）',t.p.toFixed(1)+' g',a.proteinMin+'〜'+a.proteinMax+' g'],['脂質（F）',t.f.toFixed(1)+' g','上限 '+a.fatMax+'g'],['炭水化物（C）',t.c.toFixed(1)+' g','糖質とは別'],['糖質',t.sugarKnown?t.sugar.toFixed(1)+' g（判明分）':'不明',a.carbMin+'〜'+a.carbMax+' g（暫定）'],['歩数',daily(s).steps==null?'未記録':Number(daily(s).steps).toLocaleString()+' 歩',goalSteps(s).toLocaleString()+' 歩']];return `<section class="card"><h2>今日の記録・目標一覧</h2><div class="analysis-table">${rows.map(([name,value,goal])=>`<div class="analysis-row"><strong>${name}</strong><div class="analysis-value">${value}</div><small>目標：${goal}</small></div>`).join('')}</div></section>`}
function workoutTab(){return `<h2>運動（任意）</h2><section class="card"><div class="stat">ジム：任意（義務なし）</div><p>行きたい時だけジムに行き、実施した場合だけ記録してください。行かなくても未実施・減点扱いはしません。</p><p>歩数は平日${num(state.settings.stepWeekday).toLocaleString()}歩・休日${num(state.settings.stepWeekend).toLocaleString()}歩を維持し、これ以上増やしません。</p><p>朝散歩（15〜20分）は任意です。起床時刻は変えず、行かない日も未実施扱いにはなりません。</p><button class="mini" id="workoutInput">運動・歩数を入力</button></section>${measurementPolicy()}`}
function analysisPage(){return `<div class="row between"><h2>グラフ・分析</h2></div>${progressReview()}<p class="muted">表示期間はすべてのグラフに共通です。体重は折れ線、その他は棒：記録値／破線：目標値。記録のない日は0として扱いません。糖質が不明な食品は炭水化物から推定しません。</p>${analysisOverview(today())}${pfcPanel(today())}<section class="card"><h2>今日の栄養バランス</h2><p class="muted">目標値に対する摂取割合。脂質は1日の上限と比較します。炭水化物と糖質は別集計です。</p>${nutrientBars(today())}</section><section class="card"><div class="row between"><strong>グラフの表示期間</strong><select id="range" style="width:auto">${[['7','1週間'],['15','半月'],['30','1ヶ月'],['year','1年'],['custom','期間指定']].map(([v,l])=>`<option value="${v}" ${analysisRange===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="row between" style="margin-top:12px;gap:8px"><button type="button" id="rangePrev">◀ 前へ</button><span id="rangeLabel" style="font-size:13px;text-align:center;flex:1"></span><button type="button" id="rangeNext">次へ ▶</button></div><div id="customRange" style="display:${analysisRange==='custom'?'block':'none'};margin-top:12px"><label>開始日 <input type="date" id="rangeStart" value="${analysisCustomStart}"></label><label>終了日 <input type="date" id="rangeEnd" value="${analysisCustomEnd}"></label></div></section><div class="analysis-charts">${[['weight','体重と7日平均'],['cal','摂取カロリー'],['p','タンパク質'],['f','脂質'],['c','炭水化物'],['sugar','糖質（判明分）'],['pfc','PFCバランス（熱量比）'],['steps','歩数']].map(([k,v])=>`<section class="card"><h2>${v}</h2><canvas class="chart" data-chart="${k}"></canvas>${k==='pfc'?'<p class="muted">各日のP・F・Cを熱量換算した割合（%）。緑：P、橙：F、青：C。未記録日は空白です。</p>':''}${k==='sugar'?'<p class="muted">糖質が判明している食品の合計です。糖質不明の食品がある日は実際の合計より少ない場合があります。</p>':''}</section>`).join('')}</div>`}
function settingsPage(){let s=state.settings;return `<h2>設定・バックアップ</h2><section class="card"><div class="tag">アプリバージョン</div><div class="stat">Ver 1.9.9</div><p class="muted">計測フェーズ・ジム任意化・7日平均で判定・既存記録維持・タンパク質下限80g化（毎日100g廃止）・朝散歩は任意・食品はどの食事区分でも選択可能に・食品JSONの貼り付けボタン追加・食品JSON登録カードを設定ページにも設置・ラベル照合で食品マスターを直接更新（青じそドレッシング修正＋ギリシャヨーグルトりんごと米久しっとりサラダチキンを追加）</p></section><section class="card"><h2>テーマカラー</h2><p class="muted">カラーサークルから好きな色を選べます。選んだ色はボタン・グラフ・進捗バーなどに反映され、端末内に保存されます。</p><div class="row" style="align-items:center;gap:16px"><label class="field" style="max-width:140px"><span>色を選択</span><input type="color" id="accentColorPicker" value="${/^#[0-9a-fA-F]{6}$/.test(s.accentColor||'')?s.accentColor:'#146c73'}" style="width:88px;height:62px;padding:4px;cursor:pointer" aria-label="テーマカラーを選択"></label><div><div class="row"><span id="accentColorSample" style="display:inline-block;width:38px;height:38px;border-radius:50%;background:var(--accent);border:2px solid var(--line)"></span><strong id="accentColorHex">${esc(s.accentColor||'#146c73')}</strong></div><button type="button" class="mini" id="resetAccentColor" style="margin-top:8px">標準色に戻す</button></div></div></section><div class="two"><section class="card"><h2>目標設定</h2><form id="settingsForm" class="stack"><div class="formgrid">${[['calMin','カロリー下限 kcal'],['calMax','カロリー上限 kcal'],['proteinMin','タンパク質下限 g'],['proteinMax','タンパク質上限 g'],['fatMax','脂質上限 g'],['carbMin','糖質下限 g（暫定）'],['carbMax','糖質上限 g（暫定）'],['goal1','第1目標 kg'],['goal2','最終目標 kg'],['stepWeekday','平日歩数'],['stepWeekend','休日歩数']].map(([k,v])=>`<div class="field"><label>${v}</label><input type="number" step="0.1" name="${k}" value="${s[k]}" required></div>`).join('')}</div><p class="muted">脂質の上限は設定値（現行60g）を目安にします。タンパク質は2026-11-23の方針変更で下限80g・上限100gです（設定を手動で変更した場合はそちらが優先されます）。</p><button class="primary">設定を保存</button></form></section><section class="card"><h2>バックアップ</h2><p>JSONには食事写真も含まれます。復元は現在のデータを置き換えます。</p><div class="stack"><button id="exportJson">全データをJSON出力</button><button id="exportCsv">記録をCSV出力（ZIPではなく複数CSV）</button><label class="field">JSONファイルを復元<input id="importJson" type="file" accept=".json,application/json"></label><button id="wipe" class="danger">全記録を初期化</button></div></section></div>${backupManagementUI()}${measurementPolicy()}<section class="card"><h2>健康診断結果（参考情報）</h2><p class="muted">測定日：不明（登録しません）／診断・病名の自動判定は行いません。</p><div class="grid">${[['尿酸値',state.healthCheck.uricAcid,'mg/dL'],['クレアチニン',state.healthCheck.creatinine,'mg/dL'],['eGFR',state.healthCheck.egfr,'mL/min/1.73㎡'],['尿蛋白',state.healthCheck.urineProtein,''],['腹囲',state.healthCheck.waist,'cm'],['血糖値',state.healthCheck.glucose,'mg/dL'],['中性脂肪',state.healthCheck.triglycerides,'mg/dL']].map(([k,v,u])=>`<div class="item"><strong>${k}</strong><div>${esc(v)} ${esc(u)}</div></div>`).join('')}</div><p class="muted">尿酸値は正常上限付近です。今回の腎機能関連数値に明らかな異常を示す所見はありませんが、将来の健康状態を保証するものではありません。</p><h3>健康管理の注意事項</h3><ul><li>極端な糖質制限、断食、急激なカロリー制限を避ける</li><li>運動前後に水分を補給し、脱水を避ける</li><li>激しい運動を無理に続けない</li><li>アルコールや砂糖入り飲料の過剰摂取を避ける</li><li>尿酸値を数か月後に再確認する</li><li>十分な睡眠と休養を優先する</li><li>関節の急な腫れや強い痛みがあれば運動を中止し、医療機関に相談</li></ul></section><section class="card"><h2>チェックリストの編集</h2><p class="muted">曜日は日・月・火・水・木・金・土。▲▼で順番変更。削除済み項目の履歴は内部に残ります。</p><div id="checkEditor">${state.checkDefs.filter(x=>x.id!=='sleep'&&x.id!=='gym'&&!/ジム|gym|運動実施/i.test(x.name||'')).map((x,i)=>`<div class="item"><div class="row"><input style="flex:1;min-width:150px" data-defname="${x.id}" value="${esc(x.name)}"><button class="mini" data-move="${x.id}" data-dir="-1">▲</button><button class="mini" data-move="${x.id}" data-dir="1">▼</button><button class="mini danger" data-deldef="${x.id}">削除</button></div><div class="row">${DAYS.map((n,j)=>`<label class="row"><input type="checkbox" data-defday="${x.id}" value="${j}" ${x.days.includes(j)?'checked':''}>${n}</label>`).join('')}</div><label class="row"><input type="checkbox" data-defscheduled="${x.id}" ${x.scheduled?'checked':''}>運動予定日のみ表示</label></div>`).join('')}</div><div class
